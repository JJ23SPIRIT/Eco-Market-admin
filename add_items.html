<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product | EcoMarket Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --forest: #013220; --gold: #FFD700; --black: #050a05; --glass: rgba(255, 255, 255, 0.03); --border: rgba(255, 215, 0, 0.2); }
        
        body { font-family: 'Poppins', sans-serif; background: var(--black); color: white; margin: 0; overflow-x: hidden; }

        /* Compact Top Bar */
        .top-bar { 
            background: var(--forest); padding: 10px 5%; display: flex; 
            justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--gold); position: sticky; top: 0; z-index: 500;
        }
        .menu-trigger { color: var(--gold); font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .menu-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .top-logo { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.1rem; }

        /* Sliding Sidebar */
        .sidebar {
            position: fixed; top: 0; left: -300px; width: 260px; height: 100vh;
            background: rgba(1, 50, 32, 0.98); backdrop-filter: blur(15px);
            z-index: 2000; transition: 0.4s ease;
            padding: 30px 20px; border-right: 1px solid var(--gold);
            display: flex; flex-direction: column;
        }
        .sidebar.active { left: 0; }
        .sidebar-header { text-align: center; margin-bottom: 30px; }
        .profile-circle {
            width: 60px; height: 60px; background: var(--gold); color: var(--forest);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: 800; margin: 0 auto 10px; border: 2px solid rgba(255,255,255,0.1);
        }
        .sidebar-biz-name { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1rem; }
        .nav-link { 
            display: flex; align-items: center; gap: 12px; padding: 12px;
            color: #ccc; text-decoration: none; border-radius: 10px;
            margin-bottom: 5px; transition: 0.2s; font-size: 0.85rem;
        }
        .nav-link i { color: var(--gold); width: 18px; text-align: center; }
        .nav-link:hover, .nav-link.active { background: rgba(255,215,0,0.1); color: white; }
        
        /* Notification Badge */
        .nav-badge { background: var(--gold); color: var(--forest); font-size: 0.65rem; padding: 2px 7px; border-radius: 50px; font-weight: 800; margin-left: auto; }

        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1500; display: none; }
        .sidebar-overlay.active { display: block; }

        /* Container & Compact Form */
        .container { max-width: 900px; margin: 20px auto; padding: 0 4%; }
        .admin-card { background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 25px; backdrop-filter: blur(15px); }

        .form-section { margin-bottom: 25px; }
        .section-title { display: flex; align-items: center; gap: 8px; color: var(--gold); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; margin-bottom: 15px; }
        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        .grid-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .input-group { margin-bottom: 12px; display: flex; flex-direction: column; }
        .input-group label { font-size: 0.65rem; color: #aaa; margin-bottom: 6px; text-transform: uppercase; }
        
        input, select, textarea { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 10px; padding: 12px; color: white; outline: none; transition: 0.3s; font-size: 0.85rem; }
        input:focus { border-color: var(--gold); }

        .cat-toolbar { display: flex; gap: 8px; margin-top: 8px; }
        .cat-btn { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: #ccc; cursor: pointer; font-size: 0.65rem; font-weight: 600; }
        
        /* Media Hub Scaling */
        .upload-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 5px; }
        .media-box { 
            border: 1px dashed var(--border); border-radius: 10px; height: 100px; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; position: relative; overflow: hidden; background: rgba(0,0,0,0.2);
        }
        .media-box img { width: 100%; height: 100%; object-fit: cover; }
        .media-box span { font-size: 0.55rem; color: #888; text-align: center; padding: 5px; line-height: 1.2; }

        #progress-container { width: 100%; background: #111; border-radius: 10px; height: 5px; margin-top: 15px; display: none; overflow: hidden; }
        #progress-bar { width: 0%; background: var(--gold); height: 100%; transition: 0.3s; }

        .save-btn { width: 100%; padding: 16px; background: var(--gold); color: var(--forest); border: none; border-radius: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-top: 15px; font-size: 0.85rem; }

        /* 📱 OPTIMIZED MOBILE SCALE */
        @media (max-width: 850px) {
            .grid-row { grid-template-columns: 1fr; }
            .admin-card { padding: 15px; }
            .container { margin: 15px auto; }
            .media-box { height: 90px; }
            .section-title { font-size: 0.6rem; }
            input, select, textarea { padding: 10px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<!-- Sidebar Navigation -->
<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="profile-circle" id="profile-initial">?</div>
        <div class="sidebar-biz-name" id="display-biz-name">Admin Portal</div>
    </div>
    <nav class="nav-list" style="list-style: none; padding: 0;">
        <a href="orders.html" class="nav-link">
            <i class="fa-solid fa-house"></i> Active Orders
            <span class="nav-badge" id="side-count">0</span>
        </a>
        <a href="#" class="nav-link active" onclick="toggleSidebar()"><i class="fa-solid fa-plus"></i> Add New Item</a>
        <a href="inventory.html" class="nav-link"><i class="fa-solid fa-boxes-stacked"></i> Inventory</a>
        <a href="completed_orders.html" class="nav-link"><i class="fa-solid fa-check-double"></i> Completed Orders</a>
        <a href="profile.html" class="nav-link"><i class="fa-solid fa-user-gear"></i> My Profile</a>
    </nav>
    <a href="#" class="nav-link" onclick="localStorage.removeItem('eco_user_prefix'); location.href='index.html'" style="margin-top: auto; color: #ff4444; text-decoration: none;"><i class="fa-solid fa-power-off"></i> Logout</a>
</aside>

<div class="top-bar">
    <div class="menu-trigger" onclick="toggleSidebar()">
        <i class="fa-solid fa-bars-staggered"></i>
        <span class="menu-label">Menu</span>
    </div>
    <div class="top-logo">ECO<span>MARKET</span></div>
    <div style="width: 20px;"></div>
</div>

<div class="container">
    <div class="admin-card">
        <div class="form-section">
            <div class="section-title">Identity & Info</div>
            <div class="grid-row">
                <div class="input-group">
                    <label>Item ID (Auto)</label>
                    <input type="text" id="prod-id" readonly style="color: var(--gold); font-weight: bold;">
                </div>
                <div class="input-group">
                    <label>Product Name*</label>
                    <input type="text" id="prod-name" placeholder="e.g. Luxury Bag">
                </div>
            </div>
            <div class="input-group">
                <label>Description*</label>
                <textarea id="prod-desc" rows="2" placeholder="Details for customers..."></textarea>
            </div>
        </div>

        <div class="form-section">
            <div class="section-title">Pricing & Stock</div>
            <div class="grid-row">
                <div class="input-group">
                    <label>Price (₵)*</label>
                    <input type="number" id="prod-price" placeholder="0.00">
                </div>
                <div class="input-group">
                    <label>Stock Level</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="number" id="prod-stock" value="1" style="flex: 1;">
                        <label style="display: flex; align-items: center; gap: 4px; font-size: 0.6rem; background: rgba(0,0,0,0.2); padding: 0 8px; border-radius: 8px; border: 1px solid var(--border);">
                            <input type="checkbox" id="prod-unlimited"> Infinite
                        </label>
                    </div>
                </div>
            </div>
            <div class="input-group">
                <label>Category*</label>
                <select id="prod-category"></select>
                <div class="cat-toolbar">
                    <button class="cat-btn" onclick="addNewCategory()">+ New</button>
                    <button class="cat-btn" onclick="removeCategory()">- Remove</button>
                </div>
            </div>
        </div>

        <div class="form-section">
            <div class="section-title">Multimedia</div>
            <div class="upload-grid">
                <label class="media-box" for="main-file">
                    <img id="main-preview" style="display:none">
                    <span id="main-prompt">📸 Main Image*</span>
                    <input type="file" id="main-file" hidden accept="image/*">
                </label>
                <label class="media-box" for="extra-files">
                    <span id="extra-prompt">🖼 Extra Gallery</span>
                    <input type="file" id="extra-files" hidden accept="image/*" multiple>
                </label>
                <label class="media-box" for="video-file">
                    <span id="video-prompt">🎥 Item Video</span>
                    <input type="file" id="video-file" hidden accept="video/*">
                </label>
            </div>
            <div id="extra-previews" class="upload-grid" style="margin-top: 10px;"></div>
            <div id="progress-container"><div id="progress-bar"></div></div>
        </div>

        <button class="save-btn" id="save-btn">Publish Product</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-storage.js";

    const firebaseConfig = { apiKey: "AIzaSyDtPxmJUBCweFBswJVflEVuc4jp6-m0BVM", authDomain: "prime-dusk.firebaseapp.com", projectId: "prime-dusk", storageBucket: "prime-dusk.firebasestorage.app" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const userPrefix = localStorage.getItem('eco_user_prefix');
    if(!userPrefix) window.location.href = 'index.html';

    window.toggleSidebar = () => {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    };

    // SETUP HEADER & BADGE
    document.getElementById('display-biz-name').innerText = localStorage.getItem('eco_biz_name') || "Admin Portal";
    document.getElementById('profile-initial').innerText = localStorage.getItem('eco_user_initial') || "?";

    onSnapshot(collection(db, `${userPrefix}_orders`), snap => {
        document.getElementById('side-count').innerText = snap.docs.length;
    });

    (async () => {
        const userSnap = await getDoc(doc(db, "users", userPrefix));
        if(userSnap.exists()) {
            const data = userSnap.data();
            document.getElementById('display-biz-name').innerText = data.business.name;
            document.getElementById('profile-initial').innerText = data.personal.fname[0].toUpperCase();
        }
    })();

    const pID = 'PRD-' + Math.random().toString(36).substr(2, 6).toUpperCase();
    document.getElementById('prod-id').value = pID;

    const catCollection = `${userPrefix}_categories`;
    onSnapshot(collection(db, catCollection), snap => {
        document.getElementById('prod-category').innerHTML = snap.docs.map(d => `<option value="${d.data().name}" data-id="${d.id}">${d.data().name}</option>`).join('');
    });

    window.addNewCategory = async () => {
        const n = prompt("Category Name:");
        if(n) await addDoc(collection(db, catCollection), { name: n });
    };

    window.removeCategory = async () => {
        const sel = document.getElementById('prod-category');
        const id = sel.options[sel.selectedIndex]?.dataset.id;
        if(id && confirm(`Remove "${sel.value}"?`)) await deleteDoc(doc(db, catCollection, id));
    };

    let mainFile, videoFile, extraFiles = [];

    document.getElementById('main-file').onchange = e => {
        mainFile = e.target.files[0];
        const reader = new FileReader();
        reader.onload = x => {
            const img = document.getElementById('main-preview');
            img.src = x.target.result; img.style.display = "block";
            document.getElementById('main-prompt').style.display = "none";
        }
        reader.readAsDataURL(mainFile);
    };

    document.getElementById('video-file').onchange = e => {
        videoFile = e.target.files[0];
        document.getElementById('video-prompt').innerHTML = "✅ Video Ready";
    };

    document.getElementById('extra-files').onchange = e => {
        extraFiles = Array.from(e.target.files).slice(0, 3);
        document.getElementById('extra-previews').innerHTML = extraFiles.map(f => `<div class="media-box"><span>${f.name.substring(0,8)}...</span></div>`).join('');
    };

    document.getElementById('save-btn').onclick = async () => {
        const name = document.getElementById('prod-name').value.trim();
        const price = document.getElementById('prod-price').value;
        const btn = document.getElementById('save-btn');
        if(!name || !price || !mainFile) { alert("Complete Name, Price & Image!"); return; }

        btn.disabled = true; btn.innerText = "Uploading...";
        document.getElementById('progress-container').style.display = "block";
        document.getElementById('progress-bar').style.width = "20%";

        try {
            const mainRef = ref(storage, `${userPrefix}/products/${pID}/main`);
            await uploadBytes(mainRef, mainFile);
            const mainUrl = await getDownloadURL(mainRef);

            let extraUrls = [];
            for(let i=0; i<extraFiles.length; i++) {
                const eRef = ref(storage, `${userPrefix}/products/${pID}/extra_${i}`);
                await uploadBytes(eRef, extraFiles[i]);
                extraUrls.push(await getDownloadURL(eRef));
            }

            let videoUrl = null;
            if(videoFile) {
                const vRef = ref(storage, `${userPrefix}/products/${pID}/video`);
                await uploadBytes(vRef, videoFile);
                videoUrl = await getDownloadURL(vRef);
            }

            document.getElementById('progress-bar').style.width = "100%";
            await addDoc(collection(db, `${userPrefix}_products`), {
                productID: pID, name: name, price: parseFloat(price),
                stock: parseInt(document.getElementById('prod-stock').value),
                unlimited: document.getElementById('prod-unlimited').checked,
                category: document.getElementById('prod-category').value,
                description: document.getElementById('prod-desc').value,
                image: mainUrl, extraImages: extraUrls, video: videoUrl,
                createdAt: new Date().toISOString()
            });

            alert("Published!");
            location.reload();
        } catch (e) {
            alert("Error saving product.");
            btn.disabled = false; btn.innerText = "Publish Product";
        }
    };
</script>
</body>
</html>
