<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales History | EcoMarket Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --forest: #013220; --gold: #FFD700; --black: #050a05; --glass: rgba(255, 255, 255, 0.03); --border: rgba(255, 215, 0, 0.15); }
        body { font-family: 'Poppins', sans-serif; background: var(--black); color: white; margin: 0; overflow-x: hidden; }

        /* Navigation */
        .top-bar { background: var(--forest); padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gold); position: sticky; top: 0; z-index: 500; }
        .menu-trigger { color: var(--gold); font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .menu-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        /* Sidebar */
        .sidebar { position: fixed; top: 0; left: -300px; width: 260px; height: 100vh; background: rgba(1, 50, 32, 0.98); backdrop-filter: blur(15px); z-index: 2000; transition: 0.4s ease; padding: 30px 20px; border-right: 1px solid var(--gold); display: flex; flex-direction: column; }
        .sidebar.active { left: 0; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 14px; color: #ccc; text-decoration: none; border-radius: 10px; margin-bottom: 5px; font-size: 0.85rem; }
        .nav-link.active { background: rgba(255,215,0,0.1); color: white; }
        .nav-badge { background: var(--gold); color: var(--forest); font-size: 0.65rem; padding: 2px 7px; border-radius: 50px; font-weight: 800; margin-left: auto; }
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1500; display: none; }
        .sidebar-overlay.active { display: block; }

        /* Content Area */
        #admin-content { padding: 20px 4%; text-align: center; }
        h2 { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.5rem; margin-bottom: 20px; }
        
        /* Adjusted Search Bar */
        #search-input { 
            width: 90%; max-width: 320px; padding: 12px 20px; 
            background: var(--glass); border: 1px solid var(--forest); 
            border-radius: 30px; color: white; outline: none; 
            display: block; margin: 0 auto 35px; text-align: center; font-size: 0.85rem;
        }

        /* HISTORY GRID (FOLDER STYLE) */
        .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        
        .history-folder { background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 15px; text-align: center; transition: 0.3s; cursor: pointer; position: relative; }
        .history-folder:active { transform: scale(0.95); }
        .folder-check { position: absolute; top: 10px; right: 10px; color: #25D366; font-size: 0.8rem; }

        .customer-avatar { width: 60px; height: 60px; background: #222; color: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 800; margin: 0 auto 12px; border: 1px solid var(--border); }
        .folder-name { font-weight: 600; font-size: 0.85rem; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .folder-meta { font-family: monospace; font-size: 0.65rem; color: #666; margin-bottom: 8px; }
        .folder-total { color: var(--gold); font-weight: 800; font-size: 0.9rem; }

        /* DETAIL MODAL */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; display: none; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(10px); }
        .modal-content { background: var(--forest); border: 1px solid var(--gold); border-radius: 25px; width: 100%; max-width: 450px; overflow: hidden; position: relative; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-header { padding: 25px; border-bottom: 1px solid rgba(255,215,0,0.1); text-align: center; }
        .modal-body { padding: 20px; max-height: 50vh; overflow-y: auto; }
        
        .item-row { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .item-img { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; }
        
        .modal-footer { padding: 20px; background: rgba(0,0,0,0.2); border-top: 1px solid rgba(255,215,0,0.1); }
        .btn-del { width: 100%; padding: 14px; background: rgba(255,68,68,0.1); color: #ff4444; border: 1px solid #ff4444; border-radius: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; margin-top: 15px; }

        .close-btn { position: absolute; top: 15px; right: 15px; color: white; cursor: pointer; font-size: 1.2rem; }

        @media (max-width: 480px) { .history-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }
    </style>
</head>
<body>

<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div id="profile-initial" style="width: 60px; height: 60px; background: var(--gold); color: var(--forest); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800; margin: 0 auto 10px; border: 2px solid white;">?</div>
        <div id="display-biz-name" style="color: var(--gold); font-family: 'Playfair Display';">Admin</div>
    </div>
    <nav>
        <a href="orders.html" class="nav-link">
            <i class="fa-solid fa-house"></i> Active Orders
            <span class="nav-badge" id="side-count">0</span>
        </a>
        <a href="add_items.html" class="nav-link"><i class="fa-solid fa-plus"></i> Add New Item</a>
        <a href="inventory.html" class="nav-link"><i class="fa-solid fa-boxes-stacked"></i> Inventory</a>
        <a href="#" class="nav-link active"><i class="fa-solid fa-check-double"></i> History</a>
        <a href="profile.html" class="nav-link"><i class="fa-solid fa-user-gear"></i> My Profile</a>
    </nav>
    <a href="#" class="nav-link" onclick="localStorage.clear(); location.href='index.html'" style="margin-top: auto; color: #ff4444;"><i class="fa-solid fa-power-off"></i> Logout</a>
</aside>

<!-- HISTORY DETAIL MODAL -->
<div class="modal" id="historyModal">
    <div class="modal-content">
        <div class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></div>
        <div class="modal-header">
            <div class="customer-avatar" id="m-avatar" style="background: var(--gold); color: var(--forest);">?</div>
            <h3 id="m-name" style="margin:0; font-family:'Playfair Display'; color:var(--gold);">Customer Name</h3>
            <p id="m-date" style="color:#888; font-size:0.75rem; margin:5px 0;"></p>
            <div class="folder-meta" id="m-id">ID: 000000</div>
        </div>
        <div class="modal-body" id="m-items"></div>
        <div class="modal-footer">
            <div style="display:flex; justify-content:space-between; margin-bottom:5px; font-weight:800;">
                <span>Total Paid:</span>
                <span id="m-total" style="color:var(--gold); font-size:1.2rem;">₵0.00</span>
            </div>
            <button class="btn-del" id="m-del-btn">Delete from History</button>
        </div>
    </div>
</div>

<div id="admin-content">
    <div class="top-bar">
        <div class="menu-trigger" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars-staggered"></i>
            <span class="menu-label">Menu</span>
        </div>
        <div style="font-family: 'Playfair Display'; color: var(--gold); font-weight:bold;">ECO<span>MARKET</span></div>
        <div style="width: 25px;"></div>
    </div>

    <h2>Sales History</h2>
    <input type="text" id="search-input" placeholder="Search history...">

    <div class="history-grid" id="history-list">
        <!-- History Folders injected here -->
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyDtPxmJUBCweFBswJVflEVuc4jp6-m0BVM", authDomain: "prime-dusk.firebaseapp.com", projectId: "prime-dusk" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const userPrefix = localStorage.getItem('eco_user_prefix');
    if(!userPrefix) window.location.href = 'index.html';

    document.getElementById('display-biz-name').innerText = localStorage.getItem('eco_biz_name');
    document.getElementById('profile-initial').innerText = localStorage.getItem('eco_user_initial');

    window.toggleSidebar = () => {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    };

    onSnapshot(collection(db, `${userPrefix}_orders`), snap => {
        document.getElementById('side-count').innerText = snap.docs.length;
    });

    let history = [];
    onSnapshot(collection(db, `${userPrefix}_completed_orders`), snap => {
        history = snap.docs.map(d => ({ firebaseID: d.id, ...d.data() }));
        history.sort((a,b) => new Date(b.completedAt || b.timestamp) - new Date(a.completedAt || a.timestamp));
        render();
    });

    function render() {
        const list = document.getElementById('history-list');
        const term = document.getElementById('search-input').value.toLowerCase();
        
        const filtered = history.filter(o => 
            o.customer.name.toLowerCase().includes(term) || 
            (o.salesID && o.salesID.toLowerCase().includes(term))
        );

        list.innerHTML = filtered.map(o => `
            <div class="history-folder" onclick="openHistory('${o.firebaseID}')">
                <i class="fa-solid fa-circle-check folder-check"></i>
                <div class="customer-avatar">${o.customer.name.charAt(0).toUpperCase()}</div>
                <div class="folder-name">${o.customer.name}</div>
                <div class="folder-meta">${o.salesID || 'NO ID'}</div>
                <div class="folder-total">₵${o.totalAmount.toFixed(2)}</div>
            </div>
        `).join('');
    }

    document.getElementById('search-input').oninput = render;

    window.openHistory = (id) => {
        const o = history.find(x => x.firebaseID === id);
        document.getElementById('m-avatar').innerText = o.customer.name.charAt(0).toUpperCase();
        document.getElementById('m-name').innerText = o.customer.name;
        document.getElementById('m-date').innerText = "Fulfilled: " + new Date(o.completedAt || o.timestamp).toLocaleString();
        document.getElementById('m-id').innerText = "SALES ID: " + (o.salesID || 'N/A');
        document.getElementById('m-total').innerText = "₵" + o.totalAmount.toFixed(2);
        
        document.getElementById('m-items').innerHTML = o.items.map(i => `
            <div class="item-row">
                <img src="${i.image}" class="item-img" onerror="this.src='https://via.placeholder.com/50'">
                <div style="flex:1">
                    <div style="font-size:0.85rem; font-weight:600;">${i.name}</div>
                    <div style="font-size:0.7rem; color:#aaa;">Qty: ${i.qty} | ₵${i.price}</div>
                </div>
            </div>
        `).join('');

        document.getElementById('m-del-btn').onclick = () => deleteEntry(id);
        document.getElementById('historyModal').style.display = 'flex';
    };

    async function deleteEntry(id) {
        if(confirm("Permanently delete this record?")) {
            await deleteDoc(doc(db, `${userPrefix}_completed_orders`, id));
            closeModal();
        }
    }

    window.closeModal = () => { document.getElementById('historyModal').style.display = 'none'; };
</script>
</body>
</html>
