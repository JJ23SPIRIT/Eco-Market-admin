<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | EcoMarket Multi-Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --forest: #013220; --gold: #FFD700; --black: #050a05; --glass: rgba(255, 255, 255, 0.03); }
        
        body { font-family: 'Poppins', sans-serif; background: var(--black); color: white; margin: 0; overflow-x: hidden; }

        /* Login Overlay Updated for User/Pass */
        #login-overlay { position: fixed; inset: 0; background: var(--black); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .login-box { background: rgba(1, 50, 32, 0.2); padding: 40px; border-radius: 20px; border: 1px solid var(--forest); text-align: center; width: 100%; max-width: 400px; backdrop-filter: blur(10px); }
        .login-box h1 { font-family: 'Playfair Display', serif; color: var(--gold); margin-bottom: 25px; }
        .login-box input { width: 90%; padding: 14px; margin-bottom: 15px; background: rgba(0,0,0,0.4); border: 1px solid var(--forest); color: white; border-radius: 10px; text-align: center; outline: none; }
        .submit-btn { width: 90%; padding: 15px; background: var(--gold); color: var(--forest); border: none; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-top: 10px; }

        /* Rectangular Menu Bar */
        .admin-nav { 
            background: var(--forest); padding: 15px 5%; display: flex; 
            justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--gold); position: sticky; top: 0; z-index: 100;
        }
        .nav-logo { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.4rem; font-weight: 700; }
        .nav-links { display: flex; gap: 12px; align-items: center; }
        .nav-item { 
            text-decoration: none; color: white; padding: 10px 18px; 
            background: rgba(255,255,255,0.05); border-radius: 8px; 
            font-size: 0.75rem; font-weight: 600; transition: 0.3s;
        }
        .nav-item:hover { background: var(--gold); color: var(--forest); }

        /* Profile Button Top Right */
        .profile-btn {
            background: var(--gold); color: var(--forest); width: 40px; height: 40px; 
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-weight: bold; cursor: pointer; border: 2px solid transparent; transition: 0.3s;
        }
        .profile-btn:hover { background: white; border-color: var(--gold); }

        /* Main Content */
        #admin-content { display: none; padding: 40px 5%; }
        h2 { font-family: 'Playfair Display', serif; color: var(--gold); text-align: center; font-size: 2rem; }

        .search-container { text-align: center; margin: 30px 0; }
        #search-input { width: 100%; max-width: 600px; padding: 15px 25px; background: var(--glass); border: 1px solid var(--forest); border-radius: 35px; color: white; outline: none; }

        .table-container { background: var(--glass); border-radius: 20px; padding: 25px; border: 1px solid rgba(255,215,0,0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { padding: 15px; text-align: left; color: var(--gold); border-bottom: 2px solid var(--forest); font-size: 0.75rem; text-transform: uppercase; }
        td { padding: 20px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }

        .item-wrapper { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; background: rgba(255,255,255,0.03); padding: 5px; border-radius: 8px; }
        .item-thumb { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; border: 1px solid rgba(255,215,0,0.3); }
        .item-info b { font-size: 0.85rem; color: #ddd; }
        .item-info small { color: var(--gold); font-weight: bold; }

        .action-btns { display: flex; gap: 10px; }
        .btn-wa { background: #25D366; color: white; padding: 8px 15px; border-radius: 6px; text-decoration: none; font-size: 0.75rem; font-weight: bold; }
        .btn-del { background: #ff4444; border: none; color: white; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h1 id="login-title">Admin Vault</h1>
        <input type="text" id="user-input" placeholder="Username (e.g. user1)">
        <input type="password" id="pass-input" placeholder="Password">
        <button class="submit-btn" onclick="checkAuth()">Authorize Access</button>
    </div>
</div>

<div id="admin-content">
    <nav class="admin-nav">
        <div class="nav-logo" id="display-biz-name">EcoMarket Admin</div>
        <div class="nav-links">
            <a href="add_items.html" class="nav-item">＋ Add Item</a>
            <a href="inventory.html" class="nav-item">📋 Inventory</a>
            <a href="completed_orders.html" class="nav-item">✅ Completed Orders</a>
            <a href="#" class="nav-item" onclick="location.reload()">🔒 Logout</a>
            <!-- Profile Button -->
            <div class="profile-btn" onclick="window.location.href='profile.html'" id="profile-initial">A</div>
        </div>
    </nav>

    <h2>Active Orders</h2>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="Search by customer name or phone...">
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Sales ID</th>
                    <th>Date</th>
                    <th>Customer Info</th>
                    <th>Purchased Items</th>
                    <th>Total Pay</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="ordersTable"></tbody>
        </table>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, deleteDoc, addDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyDtPxmJUBCweFBswJVflEVuc4jp6-m0BVM", authDomain: "prime-dusk.firebaseapp.com", projectId: "prime-dusk" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allOrders = [];
let activePrefix = ""; // This will store the username (e.g. user1)

window.checkAuth = async () => {
    const user = document.getElementById('user-input').value.toLowerCase();
    const pass = document.getElementById('pass-input').value;
    const btn = document.querySelector('.submit-btn');

    if(!user || !pass) { alert("Please enter credentials"); return; }
    
    btn.innerText = "Verifying...";
    
    try {
        // 1. Fetch user doc from 'users' collection using the username
        const userRef = doc(db, "users", user);
        const userSnap = await getDoc(userRef);

        if(userSnap.exists() && userSnap.data().password === pass) {
            const data = userSnap.data();
            activePrefix = data.username;
            
            // 2. Set UI details
            document.getElementById('display-biz-name').innerText = data.business.name;
            document.getElementById('profile-initial').innerText = data.personal.fname[0];
            
            // 3. Store prefix in session for other pages (Add item, Inventory etc)
            localStorage.setItem('eco_user_prefix', activePrefix);
            
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            
            loadOrders();
        } else {
            alert("Access Denied: Invalid Username or Password");
            btn.innerText = "Authorize Access";
        }
    } catch (e) {
        alert("Connection Error");
        btn.innerText = "Authorize Access";
    }
};

function loadOrders() {
    // Dynamic Collection Name: prefix + _orders
    const collectionName = `${activePrefix}_orders`;
    
    onSnapshot(collection(db, collectionName), snapshot => {
        allOrders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        allOrders.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        render();
    });
}

function render() {
    const term = document.getElementById('search-input').value.toLowerCase();
    const table = document.getElementById('ordersTable');
    table.innerHTML = "";

    const filtered = allOrders.filter(o => 
        o.customer.name.toLowerCase().includes(term) || 
        o.customer.phone.includes(term)
    );

    filtered.forEach(order => {
        const date = new Date(order.timestamp).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        
        let itemsHtml = "";
        order.items.forEach(item => {
            itemsHtml += `
                <div class="item-wrapper">
                    <img src="${item.image}" class="item-thumb" onerror="this.src='https://via.placeholder.com/50'">
                    <div class="item-info">
                        <b>${item.name}</b><br>
                        <small>Qty: ${item.qty} | ₵${item.price}</small>
                    </div>
                </div>
            `;
        });

        table.innerHTML += `
            <tr>
                <td style="color: var(--gold); font-weight: bold; font-family: monospace;">${order.salesID || 'N/A'}</td>
                <td style="color: #666; font-size: 0.8rem;">${date}</td>
                <td class="cust-cell">
                    <b>${order.customer.name}</b>
                    <span>${order.customer.phone}</span><br>
                    <small style="color: var(--gold)">${order.customer.gender}</small>
                </td>
                <td>${itemsHtml}</td>
                <td style="color: var(--gold); font-weight: bold; font-size: 1.1rem;">₵${order.totalAmount.toFixed(2)}</td>
                <td>
                    <div class="action-btns">
                        <a href="https://wa.me/233${order.customer.phone.substring(1)}" target="_blank" class="btn-wa">WhatsApp</a>
                        <button class="btn-del" onclick="deleteOrder('${order.id}')">Done</button>
                    </div>
                </td>
            </tr>
        `;
    });
}

document.getElementById('search-input').addEventListener('input', render);

window.deleteOrder = async (id) => {
    if(confirm("Mark this order as completed and move to history?")) {
        try {
            const orderData = allOrders.find(o => o.id === id);
            
            // Dynamic Archive Collection: prefix + _completed_orders
            const archiveName = `${activePrefix}_completed_orders`;
            const activeName = `${activePrefix}_orders`;

            await addDoc(collection(db, archiveName), {
                ...orderData,
                completedAt: new Date().toISOString()
            });

            await deleteDoc(doc(db, activeName, id));
            
            alert("Order moved to Service History!");
        } catch (error) {
            console.error("Error moving order:", error);
            alert("Failed to move order.");
        }
    }
}
</script>
</body>
</html>
