<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | EcoMarket</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --forest: #013220; --gold: #FFD700; --black: #050a05; --glass: rgba(255, 255, 255, 0.03); }
        
        body { font-family: 'Poppins', sans-serif; background: var(--black); color: white; margin: 0; overflow-x: hidden; }

        /* Login Overlay */
        #login-overlay { position: fixed; inset: 0; background: var(--black); display: flex; justify-content: center; align-items: center; z-index: 10000; padding: 20px; }
        .login-box { background: rgba(1, 50, 32, 0.2); padding: 35px; border-radius: 20px; border: 1px solid var(--forest); text-align: center; width: 100%; max-width: 400px; backdrop-filter: blur(10px); }
        .login-box h1 { font-family: 'Playfair Display', serif; color: var(--gold); margin-bottom: 25px; font-size: 1.8rem; }
        .login-box input { width: 100%; padding: 14px; margin-bottom: 15px; background: rgba(0,0,0,0.4); border: 1px solid var(--forest); color: white; border-radius: 10px; text-align: center; outline: none; box-sizing: border-box; }
        .submit-btn { width: 100%; padding: 15px; background: var(--gold); color: var(--forest); border: none; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; }

        /* Navigation */
        .admin-nav { 
            background: var(--forest); padding: 15px 5%; display: flex; 
            justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--gold); position: sticky; top: 0; z-index: 100;
        }
        .nav-logo { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.3rem; }
        .nav-links { display: flex; gap: 10px; align-items: center; }
        .nav-item { 
            text-decoration: none; color: white; padding: 8px 14px; 
            background: rgba(255,255,255,0.05); border-radius: 6px; 
            font-size: 0.7rem; font-weight: 600; transition: 0.3s;
        }

        .profile-btn {
            background: var(--gold); color: var(--forest); width: 36px; height: 36px; 
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-weight: bold; cursor: pointer; font-size: 0.9rem;
        }

        /* Content */
        #admin-content { display: none; padding: 30px 5%; }
        h2 { font-family: 'Playfair Display', serif; color: var(--gold); text-align: center; font-size: 1.6rem; margin-top: 10px; }

        #search-input { width: 100%; max-width: 600px; padding: 14px 20px; background: var(--glass); border: 1px solid var(--forest); border-radius: 30px; color: white; outline: none; display: block; margin: 20px auto; }

        .table-container { background: var(--glass); border-radius: 20px; padding: 15px; border: 1px solid rgba(255,215,0,0.1); }
        table { width: 100%; border-collapse: collapse; }
        th { padding: 12px; text-align: left; color: var(--gold); border-bottom: 2px solid var(--forest); font-size: 0.7rem; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; }

        .item-wrapper { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; background: rgba(255,255,255,0.02); padding: 6px; border-radius: 8px; }
        .item-thumb { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; border: 1px solid rgba(255,215,0,0.2); }
        
        .action-btns { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-wa, .btn-del { padding: 8px 12px; border-radius: 6px; text-decoration: none; font-size: 0.7rem; font-weight: bold; border: none; cursor: pointer; }
        .btn-wa { background: #25D366; color: white; }
        .btn-del { background: #ff4444; color: white; }

        /* 📱 RESPONSIVE MOBILE TRANSFORMATION */
        @media (max-width: 850px) {
            .admin-nav { flex-direction: column; gap: 15px; text-align: center; }
            .nav-links { overflow-x: auto; width: 100%; justify-content: flex-start; padding-bottom: 5px; scrollbar-width: none; }
            .nav-links::-webkit-scrollbar { display: none; }
            .nav-item { white-space: nowrap; }

            thead { display: none; } /* Hide table headers on mobile */
            
            tr { 
                display: block; background: rgba(255,255,255,0.03); 
                margin-bottom: 20px; border-radius: 15px; padding: 15px;
                border: 1px solid rgba(255,215,0,0.05);
            }

            td { 
                display: block; padding: 8px 0; border: none; 
                text-align: left; position: relative; padding-left: 40%;
            }

            td::before { 
                content: attr(data-label); position: absolute; left: 0; 
                font-weight: 600; color: var(--gold); font-size: 0.7rem; 
                text-transform: uppercase; 
            }

            td:last-child { border-top: 1px solid rgba(255,255,255,0.05); margin-top: 10px; padding-top: 15px; padding-left: 0; }
            td:last-child::before { display: none; }
            
            .action-btns { justify-content: space-between; }
            .btn-wa, .btn-del { flex: 1; text-align: center; padding: 12px; }
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h1>Admin Vault</h1>
        <input type="text" id="user-input" placeholder="Username">
        <input type="password" id="pass-input" placeholder="Password">
        <button class="submit-btn" onclick="checkAuth()">Authorize</button>
    </div>
</div>

<div id="admin-content">
    <nav class="admin-nav">
        <div class="nav-logo" id="display-biz-name">Admin Portal</div>
        <div class="nav-links">
            <a href="add_items.html" class="nav-item">＋ Item</a>
            <a href="inventory.html" class="nav-item">📋 Stock</a>
            <a href="completed_orders.html" class="nav-item">✅ History</a>
            <a href="#" class="nav-item" onclick="location.reload()">🔒 Logout</a>
            <div class="profile-btn" onclick="window.location.href='profile.html'" id="profile-initial">?</div>
        </div>
    </nav>

    <h2>Active Orders</h2>
    <input type="text" id="search-input" placeholder="Search customer...">

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Sales ID</th>
                    <th>Date</th>
                    <th>Customer</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="ordersTable"></tbody>
        </table>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, deleteDoc, addDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyDtPxmJUBCweFBswJVflEVuc4jp6-m0BVM", authDomain: "prime-dusk.firebaseapp.com", projectId: "prime-dusk" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allOrders = [], activePrefix = "";

window.checkAuth = async () => {
    const user = document.getElementById('user-input').value.toLowerCase().trim();
    const pass = document.getElementById('pass-input').value;
    const btn = document.querySelector('.submit-btn');

    if(!user || !pass) return;
    btn.innerText = "Verifying...";
    
    try {
        const userSnap = await getDoc(doc(db, "users", user));
        if(userSnap.exists() && userSnap.data().password === pass) {
            const data = userSnap.data();
            activePrefix = data.username;
            document.getElementById('display-biz-name').innerText = data.business.name;
            document.getElementById('profile-initial').innerText = data.personal.fname[0].toUpperCase();
            localStorage.setItem('eco_user_prefix', activePrefix);
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            loadOrders();
        } else {
            alert("Invalid Credentials");
            btn.innerText = "Authorize";
        }
    } catch (e) { alert("Auth Failed"); btn.innerText = "Authorize"; }
};

function loadOrders() {
    onSnapshot(collection(db, `${activePrefix}_orders`), snapshot => {
        allOrders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        allOrders.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        render();
    });
}

function render() {
    const term = document.getElementById('search-input').value.toLowerCase();
    const table = document.getElementById('ordersTable');
    table.innerHTML = "";

    const filtered = allOrders.filter(o => o.customer.name.toLowerCase().includes(term) || o.customer.phone.includes(term));

    filtered.forEach(order => {
        const date = new Date(order.timestamp).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        let itemsHtml = order.items.map(item => `
            <div class="item-wrapper">
                <img src="${item.image}" class="item-thumb" onerror="this.src='https://via.placeholder.com/50'">
                <div style="flex:1"><b>${item.name}</b><br><small>x${item.qty} | ₵${item.price}</small></div>
            </div>`).join('');

        table.innerHTML += `
            <tr>
                <td data-label="ID" style="color: var(--gold); font-family: monospace;">${order.salesID || 'N/A'}</td>
                <td data-label="Date" style="color: #666; font-size: 0.75rem;">${date}</td>
                <td data-label="Customer"><b>${order.customer.name}</b><br><small>${order.customer.phone}</small></td>
                <td data-label="Items">${itemsHtml}</td>
                <td data-label="Total" style="color: var(--gold); font-weight: bold;">₵${order.totalAmount.toFixed(2)}</td>
                <td>
                    <div class="action-btns">
                        <a href="tel:${order.customer.phone}" class="btn-wa" style="background:#007bff">Call</a>
                        <a href="https://wa.me/233${order.customer.phone.substring(1)}" target="_blank" class="btn-wa">WA</a>
                        <button class="btn-del" onclick="deleteOrder('${order.id}')">Done</button>
                    </div>
                </td>
            </tr>`;
    });
}

document.getElementById('search-input').addEventListener('input', render);

window.deleteOrder = async (id) => {
    if(!confirm("Mark as completed?")) return;
    try {
        const orderData = allOrders.find(o => o.id === id);
        await addDoc(collection(db, `${activePrefix}_completed_orders`), { ...orderData, completedAt: new Date().toISOString() });
        await deleteDoc(doc(db, `${activePrefix}_orders`, id));
    } catch (e) { alert("Update failed"); }
}
</script>
</body>
</html>
