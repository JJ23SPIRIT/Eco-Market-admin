<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | EcoMarket</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --forest: #013220; --gold: #FFD700; --black: #050a05; }
        body { 
            font-family: 'Poppins', sans-serif; background: var(--black); color: white; 
            margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        .login-box { 
            background: rgba(1, 50, 32, 0.2); padding: 40px 30px; border-radius: 20px; 
            border: 1px solid var(--forest); text-align: center; width: 90%; max-width: 380px; 
            backdrop-filter: blur(10px); box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        h1 { font-family: 'Playfair Display', serif; color: var(--gold); margin-bottom: 25px; font-size: 1.8rem; }
        input { 
            width: 100%; padding: 14px; margin-bottom: 15px; background: rgba(0,0,0,0.4); 
            border: 1px solid var(--forest); color: white; border-radius: 10px; 
            text-align: center; outline: none; box-sizing: border-box; font-size: 1rem;
        }
        input:focus { border-color: var(--gold); }
        .submit-btn { 
            width: 100%; padding: 15px; background: var(--gold); color: var(--forest); 
            border: none; border-radius: 10px; font-weight: 800; cursor: pointer; 
            text-transform: uppercase; transition: 0.3s;
        }
        .submit-btn:hover { background: white; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>Admin Vault</h1>
        <input type="text" id="user-input" placeholder="Username">
        <input type="password" id="pass-input" placeholder="Password">
        <button class="submit-btn" id="login-btn">Authorize Access</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDtPxmJUBCweFBswJVflEVuc4jp6-m0BVM", authDomain: "prime-dusk.firebaseapp.com", projectId: "prime-dusk" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('login-btn').onclick = async () => {
            const user = document.getElementById('user-input').value.toLowerCase().trim();
            const pass = document.getElementById('pass-input').value;
            const btn = document.getElementById('login-btn');

            if(!user || !pass) { alert("Please enter credentials"); return; }
            
            btn.innerText = "Verifying...";
            btn.disabled = true;
            
            try {
                const userSnap = await getDoc(doc(db, "users", user));

                if(userSnap.exists() && userSnap.data().password === pass) {
                    const data = userSnap.data();
                    // Save session data
                    localStorage.setItem('eco_user_prefix', data.username);
                    localStorage.setItem('eco_biz_name', data.business.name);
                    localStorage.setItem('eco_user_initial', data.personal.fname[0].toUpperCase());
                    
                    window.location.href = 'orders.html'; // Redirect to Active Orders
                } else {
                    alert("Access Denied: Invalid Username or Password");
                    btn.innerText = "Authorize Access";
                    btn.disabled = false;
                }
            } catch (e) {
                alert("Connection Error");
                btn.innerText = "Authorize Access";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
