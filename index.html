<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Vault | EcoMarket</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --forest: #013220; --gold: #FFD700; --black: #050a05; }
        body { font-family: 'Poppins', sans-serif; background: var(--black); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; box-sizing: border-box; flex-direction: column; }
        
        .login-box { 
            background: rgba(1, 50, 32, 0.2); padding: 40px; border-radius: 25px; 
            border: 1px solid var(--forest); text-align: center; width: 100%; max-width: 400px; 
            backdrop-filter: blur(15px); box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        }

        h1 { font-family: 'Playfair Display', serif; color: var(--gold); margin-bottom: 25px; font-size: 1.8rem; }
        .input-group { position: relative; margin-bottom: 15px; }
        input { width: 100%; padding: 14px; background: rgba(0,0,0,0.4); border: 1px solid var(--forest); color: white; border-radius: 12px; text-align: center; outline: none; box-sizing: border-box; font-size: 1rem; transition: 0.3s; }
        input:focus { border-color: var(--gold); }

        .submit-btn { width: 100%; padding: 16px; background: var(--gold); color: var(--forest); border: none; border-radius: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.3s; margin-top: 10px; }
        .submit-btn:disabled { opacity: 0.6; }

        .toggle-link { color: var(--gold); font-size: 0.8rem; text-decoration: none; display: block; margin-top: 20px; cursor: pointer; opacity: 0.8; }
        .toggle-link:hover { opacity: 1; text-decoration: underline; }

        .eye-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--gold); cursor: pointer; opacity: 0.6; }

        #reset-section, #new-pass-section { display: none; }
        .back-btn { background: transparent; border: 1px solid #333; color: #888; margin-top: 15px; width: 100%; padding: 12px; border-radius: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="login-box" id="auth-card">
        <!-- LOGIN VIEW -->
        <div id="login-section">
            <h1>Admin Vault</h1>
            <div class="input-group"><input type="text" id="user-input" placeholder="Username" autocomplete="off"></div>
            <div class="input-group"><input type="password" id="pass-input" placeholder="Password"></div>
            <button class="submit-btn" id="login-btn">Authorize Access</button>
            <a class="toggle-link" onclick="showReset()">Forgot Password?</a>
            <a href="sign_up.html" class="toggle-link" style="margin-top: 10px;">Create New Account</a>
        </div>

        <!-- STEP 1: VERIFY IDENTITY -->
        <div id="reset-section">
            <h1>Verify Identity</h1>
            <p style="font-size: 0.75rem; color: #888; margin-bottom: 20px;">Enter details to unlock password reset.</p>
            <div class="input-group"><input type="text" id="reset-username" placeholder="Username"></div>
            <div class="input-group"><input type="tel" id="reset-phone" placeholder="Registered Phone Number"></div>
            <button class="submit-btn" id="verify-btn">Verify Identity</button>
            <button class="back-btn" onclick="showLogin()">Cancel</button>
        </div>

        <!-- STEP 2: NEW PASSWORD -->
        <div id="new-pass-section">
            <h1>New Password</h1>
            <div class="input-group">
                <input type="password" id="new-password" placeholder="New Password">
                <i class="fa-solid fa-eye eye-icon" onclick="togglePass('new-password', this)"></i>
            </div>
            <div class="input-group">
                <input type="password" id="confirm-password" placeholder="Confirm New Password">
                <i class="fa-solid fa-eye eye-icon" onclick="togglePass('confirm-password', this)"></i>
            </div>
            <button class="submit-btn" id="finalize-reset-btn">Update Password</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDtPxmJUBCweFBswJVflEVuc4jp6-m0BVM", authDomain: "prime-dusk.firebaseapp.com", projectId: "prime-dusk" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Persistent Session Check
        if(localStorage.getItem('eco_user_prefix')) window.location.href = 'orders.html';

        // Navigation UI
        window.showReset = () => {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('reset-section').style.display = 'block';
        };
        window.showLogin = () => {
            document.getElementById('reset-section').style.display = 'none';
            document.getElementById('login-section').style.display = 'block';
        };

        // View Password Toggle
        window.togglePass = (id, icon) => {
            const el = document.getElementById(id);
            if(el.type === 'password') {
                el.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                el.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        };

        // --- AUTH LOGIC ---
        document.getElementById('login-btn').onclick = async () => {
            const user = document.getElementById('user-input').value.toLowerCase().trim();
            const pass = document.getElementById('pass-input').value;
            if(!user || !pass) return alert("Enter credentials");

            try {
                const snap = await getDoc(doc(db, "users", user));
                if(snap.exists() && snap.data().password === pass) {
                    localStorage.setItem('eco_user_prefix', user);
                    localStorage.setItem('eco_biz_name', snap.data().business.name);
                    localStorage.setItem('eco_user_initial', snap.data().personal.fname[0]);
                    window.location.href = 'orders.html';
                } else alert("Access Denied");
            } catch(e) { alert("Connection Error"); }
        };

        // --- FORGOT PASSWORD LOGIC ---
        let targetUser = "";

        document.getElementById('verify-btn').onclick = async () => {
            const user = document.getElementById('reset-username').value.toLowerCase().trim();
            const phone = document.getElementById('reset-phone').value.trim();
            const btn = document.getElementById('verify-btn');

            if(!user || !phone) return alert("Fill all fields");
            btn.disabled = true; btn.innerText = "Verifying...";

            try {
                const snap = await getDoc(doc(db, "users", user));
                if(snap.exists() && snap.data().personal.phone === phone) {
                    targetUser = user;
                    document.getElementById('reset-section').style.display = 'none';
                    document.getElementById('new-pass-section').style.display = 'block';
                } else {
                    alert("Identity Mismatch: Check Username or Phone Number.");
                    btn.disabled = false; btn.innerText = "Verify Identity";
                }
            } catch(e) { alert("Verification Failed"); btn.disabled = false; }
        };

        document.getElementById('finalize-reset-btn').onclick = async () => {
            const pass = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;

            if(!pass || pass.length < 4) return alert("Password too short");
            if(pass !== confirm) return alert("Passwords do not match");

            try {
                await updateDoc(doc(db, "users", targetUser), { password: pass });
                alert("Password Changed Successfully! Please Login.");
                location.reload();
            } catch(e) { alert("Failed to update password"); }
        };
    </script>
</body>
</html>
