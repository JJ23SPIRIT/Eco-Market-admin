<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | EcoMarket</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --forest: #013220; --gold: #FFD700; --black: #050a05; --glass: rgba(255, 255, 255, 0.03); }
        
        body { font-family: 'Poppins', sans-serif; background: var(--black); color: white; margin: 0; overflow-x: hidden; }

        /* Login Overlay */
        #login-overlay { position: fixed; inset: 0; background: var(--black); display: flex; justify-content: center; align-items: center; z-index: 10000; padding: 20px; }
        .login-box { background: rgba(1, 50, 32, 0.2); padding: 35px; border-radius: 20px; border: 1px solid var(--forest); text-align: center; width: 100%; max-width: 400px; backdrop-filter: blur(10px); }
        .login-box h1 { font-family: 'Playfair Display', serif; color: var(--gold); margin-bottom: 25px; }
        .login-box input { width: 100%; padding: 14px; margin-bottom: 15px; background: rgba(0,0,0,0.4); border: 1px solid var(--forest); color: white; border-radius: 10px; text-align: center; outline: none; box-sizing: border-box; }
        .submit-btn { width: 100%; padding: 15px; background: var(--gold); color: var(--forest); border: none; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; }

        /* Modern Top Bar */
        .top-bar { 
            background: var(--forest); padding: 15px 5%; display: flex; 
            justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--gold); position: sticky; top: 0; z-index: 500;
        }
        .menu-trigger { color: var(--gold); font-size: 1.5rem; cursor: pointer; transition: 0.3s; }
        .top-logo { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.2rem; }

        /* Sliding Sidebar */
        .sidebar {
            position: fixed; top: 0; left: -300px; width: 280px; height: 100vh;
            background: rgba(1, 50, 32, 0.98); backdrop-filter: blur(15px);
            z-index: 2000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 40px 25px; border-right: 1px solid var(--gold);
            display: flex; flex-direction: column;
        }
        .sidebar.active { left: 0; }
        .sidebar-header { text-align: center; margin-bottom: 40px; }
        .profile-circle {
            width: 70px; height: 70px; background: var(--gold); color: var(--forest);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; font-weight: 800; margin: 0 auto 15px; border: 3px solid rgba(255,255,255,0.1);
        }
        .sidebar-biz-name { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.1rem; }
        .nav-list { list-style: none; padding: 0; flex: 1; }
        .nav-link { 
            display: flex; align-items: center; gap: 15px; padding: 15px;
            color: #ccc; text-decoration: none; border-radius: 12px;
            margin-bottom: 10px; transition: 0.3s; font-size: 0.9rem;
        }
        .nav-link i { color: var(--gold); width: 20px; text-align: center; }
        .nav-link:hover, .nav-link.active { background: rgba(255,215,0,0.1); color: white; }

        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            z-index: 1500; display: none; backdrop-filter: blur(3px);
        }
        .sidebar-overlay.active { display: block; }

        /* Main Content Area */
        #admin-content { display: none; padding: 30px 5%; max-width: 1200px; margin: 0 auto; }
        h2 { font-family: 'Playfair Display', serif; color: var(--gold); text-align: center; font-size: 1.8rem; margin-top: 0; }
        #search-input { width: 100%; max-width: 600px; padding: 15px 25px; background: var(--glass); border: 1px solid var(--forest); border-radius: 35px; color: white; outline: none; display: block; margin: 25px auto; transition: 0.3s; }
        #search-input:focus { border-color: var(--gold); box-shadow: 0 0 15px rgba(255,215,0,0.1); }

        /* Desktop Table View */
        .table-container { background: var(--glass); border-radius: 20px; padding: 25px; border: 1px solid rgba(255,215,0,0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { padding: 15px; text-align: left; color: var(--gold); border-bottom: 2px solid var(--forest); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 20px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; vertical-align: middle; }

        /* Order Items Styling */
        .item-wrapper { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; padding: 8px; border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.02); }
        .item-thumb { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; border: 1px solid rgba(255,215,0,0.2); }
        
        .action-btns { display: flex; gap: 8px; }
        .btn-action { padding: 10px 15px; border-radius: 8px; text-decoration: none; font-size: 0.75rem; font-weight: 700; border: none; cursor: pointer; color: white; display: flex; align-items: center; gap: 6px; transition: 0.3s; }
        .btn-call { background: #007bff; }
        .btn-wa { background: #25D366; }
        .btn-del { background: #ff4444; }
        .btn-action:hover { transform: translateY(-2px); opacity: 0.9; }

        /* 📱 MOBILE CARD SYSTEM - THE FIX */
        @media (max-width: 850px) {
            .table-container { background: transparent; padding: 0; border: none; }
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            
            #ordersTable tr { 
                background: linear-gradient(145deg, #0a110a, #050a05); 
                margin-bottom: 25px; border-radius: 25px; 
                padding: 20px; border: 1px solid rgba(255,215,0,0.1);
                box-shadow: 0 10px 30px rgba(0,0,0,0.5);
                position: relative;
            }

            /* ID & Date Header */
            td:nth-child(1) { border: none; padding: 0; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; width: 100%; }
            td:nth-child(1)::before { content: 'Order ID'; font-size: 0.6rem; color: #666; text-transform: uppercase; position: static; }
            
            td:nth-child(2) { border: none; padding: 0; position: absolute; top: 40px; left: 20px; font-size: 0.75rem; color: #888; }
            
            /* Customer Info */
            td:nth-child(3) { border-top: 1px solid rgba(255,255,255,0.05); padding: 35px 0 15px; }
            td:nth-child(3) b { font-size: 1.1rem; color: var(--gold); }

            /* Items Section */
            td:nth-child(4) { padding: 10px 0; }

            /* Total Amount */
            td:nth-child(5) { 
                display: flex; justify-content: space-between; align-items: center; 
                padding: 15px 0; border-top: 1px solid rgba(255,255,255,0.05);
                font-size: 1.2rem;
            }
            td:nth-child(5)::before { content: 'Total Paid'; font-size: 0.8rem; color: #888; font-weight: 400; text-transform: uppercase; }

            /* Actions Footer */
            td:nth-child(6) { padding: 15px 0 0; border-top: 1px dashed rgba(255,215,0,0.2); }
            .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
            .btn-del { grid-column: span 2; justify-content: center; padding: 14px; margin-top: 5px; }
            .btn-call, .btn-wa { justify-content: center; padding: 12px; }
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h1>Admin Vault</h1>
        <input type="text" id="user-input" placeholder="Username">
        <input type="password" id="pass-input" placeholder="Password">
        <button class="submit-btn" onclick="checkAuth()">Authorize Access</button>
    </div>
</div>

<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="profile-circle" id="profile-initial">?</div>
        <div class="sidebar-biz-name" id="display-biz-name">Admin Portal</div>
    </div>
    <nav class="nav-list">
        <a href="#" class="nav-link active" onclick="toggleSidebar()"><i class="fa-solid fa-house"></i> Active Orders</a>
        <a href="add_items.html" class="nav-link"><i class="fa-solid fa-plus"></i> Add New Item</a>
        <a href="inventory.html" class="nav-link"><i class="fa-solid fa-boxes-stacked"></i> Inventory</a>
        <a href="completed_orders.html" class="nav-link"><i class="fa-solid fa-check-double"></i> Completed Orders</a>
        <a href="profile.html" class="nav-link"><i class="fa-solid fa-user-gear"></i> My Profile</a>
    </nav>
    <a href="#" class="nav-link" onclick="location.reload()" style="margin-top: auto; color: #ff4444;"><i class="fa-solid fa-power-off"></i> Logout</a>
</aside>

<div id="admin-content">
    <nav class="top-bar">
        <div class="menu-trigger" onclick="toggleSidebar()"><i class="fa-solid fa-bars-staggered"></i></div>
        <div class="top-logo">ECO<span>MARKET</span></div>
        <div style="width: 25px;"></div>
    </nav>

    <h2>Active Orders</h2>
    <input type="text" id="search-input" placeholder="Search by name or phone...">

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Sales ID</th>
                    <th>Date</th>
                    <th>Customer</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="ordersTable"></tbody>
        </table>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, deleteDoc, addDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyDtPxmJUBCweFBswJVflEVuc4jp6-m0BVM", authDomain: "prime-dusk.firebaseapp.com", projectId: "prime-dusk" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allOrders = [], activePrefix = "";

window.toggleSidebar = () => {
    document.getElementById('sidebar').classList.toggle('active');
    document.getElementById('overlay').classList.toggle('active');
};

window.checkAuth = async () => {
    const user = document.getElementById('user-input').value.toLowerCase().trim();
    const pass = document.getElementById('pass-input').value;
    const btn = document.querySelector('.submit-btn');
    if(!user || !pass) return;
    btn.innerText = "Verifying...";
    try {
        const userSnap = await getDoc(doc(db, "users", user));
        if(userSnap.exists() && userSnap.data().password === pass) {
            const data = userSnap.data();
            activePrefix = data.username;
            document.getElementById('display-biz-name').innerText = data.business.name;
            document.getElementById('profile-initial').innerText = data.personal.fname[0].toUpperCase();
            localStorage.setItem('eco_user_prefix', activePrefix);
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            loadOrders();
        } else { alert("Invalid Credentials"); btn.innerText = "Authorize Access"; }
    } catch (e) { alert("Auth Failed"); btn.innerText = "Authorize Access"; }
};

function loadOrders() {
    onSnapshot(collection(db, `${activePrefix}_orders`), snapshot => {
        allOrders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        allOrders.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        render();
    });
}

function render() {
    const term = document.getElementById('search-input').value.toLowerCase();
    const table = document.getElementById('ordersTable');
    table.innerHTML = "";
    const filtered = allOrders.filter(o => o.customer.name.toLowerCase().includes(term) || o.customer.phone.includes(term));

    filtered.forEach(order => {
        const date = new Date(order.timestamp).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        let itemsHtml = order.items.map(item => `
            <div class="item-wrapper">
                <img src="${item.image}" class="item-thumb" onerror="this.src='https://via.placeholder.com/50'">
                <div style="flex:1"><b>${item.name}</b><br><small>x${item.qty} | ₵${item.price}</small></div>
            </div>`).join('');

        table.innerHTML += `
            <tr>
                <td style="color: var(--gold); font-family: monospace; font-weight:bold;">${order.salesID || 'N/A'}</td>
                <td>${date}</td>
                <td><b>${order.customer.name}</b><br><small>${order.customer.phone}</small></td>
                <td>${itemsHtml}</td>
                <td style="color: var(--gold); font-weight: bold;">₵${order.totalAmount.toFixed(2)}</td>
                <td>
                    <div class="action-btns">
                        <a href="tel:${order.customer.phone}" class="btn-action btn-call"><i class="fa-solid fa-phone"></i> Call</a>
                        <a href="https://wa.me/233${order.customer.phone.substring(1)}" target="_blank" class="btn-action btn-wa"><i class="fa-brands fa-whatsapp"></i> Chat</a>
                        <button class="btn-action btn-del" onclick="deleteOrder('${order.id}')"><i class="fa-solid fa-check"></i> Done</button>
                    </div>
                </td>
            </tr>`;
    });
}

document.getElementById('search-input').addEventListener('input', render);

window.deleteOrder = async (id) => {
    if(!confirm("Mark this order as completed?")) return;
    try {
        const orderData = allOrders.find(o => o.id === id);
        await addDoc(collection(db, `${activePrefix}_completed_orders`), { ...orderData, completedAt: new Date().toISOString() });
        await deleteDoc(doc(db, `${activePrefix}_orders`, id));
    } catch (e) { alert("Error updating order."); }
}
</script>
</body>
</html>
