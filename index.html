<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | EcoMarket</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --forest: #013220; --gold: #FFD700; --black: #050a05; --glass: rgba(255, 255, 255, 0.03); }
        
        body { font-family: 'Poppins', sans-serif; background: var(--black); color: white; margin: 0; overflow-x: hidden; }

        /* Login Overlay */
        #login-overlay { position: fixed; inset: 0; background: var(--black); display: flex; justify-content: center; align-items: center; z-index: 10000; padding: 20px; }
        .login-box { background: rgba(1, 50, 32, 0.2); padding: 30px; border-radius: 20px; border: 1px solid var(--forest); text-align: center; width: 100%; max-width: 380px; backdrop-filter: blur(10px); }
        .login-box h1 { font-family: 'Playfair Display', serif; color: var(--gold); margin-bottom: 20px; font-size: 1.6rem; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 12px; background: rgba(0,0,0,0.4); border: 1px solid var(--forest); color: white; border-radius: 8px; text-align: center; outline: none; box-sizing: border-box; }
        .submit-btn { width: 100%; padding: 14px; background: var(--gold); color: var(--forest); border: none; border-radius: 8px; font-weight: 800; cursor: pointer; text-transform: uppercase; }

        /* Compact Top Bar */
        .top-bar { 
            background: var(--forest); padding: 10px 5%; display: flex; 
            justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--gold); position: sticky; top: 0; z-index: 500;
        }
        .menu-trigger { color: var(--gold); font-size: 1.3rem; cursor: pointer; }
        .top-logo { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.1rem; }

        /* Sliding Sidebar */
        .sidebar {
            position: fixed; top: 0; left: -300px; width: 260px; height: 100vh;
            background: rgba(1, 50, 32, 0.98); backdrop-filter: blur(15px);
            z-index: 2000; transition: 0.4s ease;
            padding: 30px 20px; border-right: 1px solid var(--gold);
            display: flex; flex-direction: column;
        }
        .sidebar.active { left: 0; }
        .sidebar-header { text-align: center; margin-bottom: 30px; }
        .profile-circle {
            width: 60px; height: 60px; background: var(--gold); color: var(--forest);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: 800; margin: 0 auto 10px; border: 2px solid rgba(255,255,255,0.1);
        }
        .sidebar-biz-name { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1rem; }
        .nav-link { 
            display: flex; align-items: center; gap: 12px; padding: 12px;
            color: #ccc; text-decoration: none; border-radius: 10px;
            margin-bottom: 5px; transition: 0.2s; font-size: 0.85rem;
        }
        .nav-link i { color: var(--gold); width: 18px; text-align: center; }
        .nav-link:hover, .nav-link.active { background: rgba(255,215,0,0.1); color: white; }

        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1500; display: none; }
        .sidebar-overlay.active { display: block; }

        /* Content Area */
        #admin-content { display: none; padding: 20px 4%; }
        h2 { font-family: 'Playfair Display', serif; color: var(--gold); text-align: center; font-size: 1.4rem; margin: 0; }
        #search-input { width: 100%; max-width: 500px; padding: 12px 20px; background: var(--glass); border: 1px solid var(--forest); border-radius: 25px; color: white; outline: none; display: block; margin: 15px auto; font-size: 0.85rem; }

        .table-container { background: var(--glass); border-radius: 15px; padding: 15px; border: 1px solid rgba(255,215,0,0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 850px; }
        th { padding: 10px; text-align: left; color: var(--gold); border-bottom: 2px solid var(--forest); font-size: 0.65rem; text-transform: uppercase; }
        td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.8rem; vertical-align: middle; }

        .item-wrapper { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; padding: 4px; border-radius: 6px; background: rgba(255,255,255,0.02); }
        .item-thumb { width: 35px; height: 35px; border-radius: 5px; object-fit: cover; border: 1px solid rgba(255,215,0,0.2); }
        
        .action-btns { display: flex; gap: 5px; }
        .btn-action { padding: 6px 10px; border-radius: 5px; text-decoration: none; font-size: 0.65rem; font-weight: 700; border: none; cursor: pointer; color: white; display: flex; align-items: center; gap: 4px; }
        .btn-call { background: #007bff; }
        .btn-wa { background: #25D366; }
        .btn-del { background: #ff4444; }

        /* 📱 OPTIMIZED MOBILE SCALE */
        @media (max-width: 850px) {
            table { min-width: 100%; }
            th { display: none; }
            tr { display: block; background: rgba(255,255,255,0.03); margin-bottom: 12px; border-radius: 12px; padding: 12px; border: 1px solid rgba(255,215,0,0.05); }
            td { display: block; padding: 5px 0; border: none; text-align: left; position: relative; padding-left: 35%; min-height: 25px; }
            td::before { content: attr(data-label); position: absolute; left: 0; font-weight: 600; color: var(--gold); font-size: 0.6rem; text-transform: uppercase; opacity: 0.7; }
            td:last-child { border-top: 1px solid rgba(255,255,255,0.05); margin-top: 8px; padding-top: 10px; padding-left: 0; }
            td:last-child::before { display: none; }
            .action-btns { justify-content: flex-start; }
            .btn-action { flex: 1; justify-content: center; padding: 10px; font-size: 0.7rem; }
            .item-wrapper { padding: 3px; }
            .item-thumb { width: 30px; height: 30px; }
            h2 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h1>Admin Vault</h1>
        <input type="text" id="user-input" placeholder="Username">
        <input type="password" id="pass-input" placeholder="Password">
        <button class="submit-btn" onclick="checkAuth()">Authorize Access</button>
    </div>
</div>

<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="profile-circle" id="profile-initial">?</div>
        <div class="sidebar-biz-name" id="display-biz-name">Admin Portal</div>
    </div>
    <nav class="nav-list" style="list-style: none; padding: 0;">
        <a href="#" class="nav-link active" onclick="toggleSidebar()"><i class="fa-solid fa-house"></i> Active Orders</a>
        <a href="add_items.html" class="nav-link"><i class="fa-solid fa-plus"></i> Add New Item</a>
        <a href="inventory.html" class="nav-link"><i class="fa-solid fa-boxes-stacked"></i> Inventory</a>
        <a href="completed_orders.html" class="nav-link"><i class="fa-solid fa-check-double"></i> Completed Orders</a>
        <a href="profile.html" class="nav-link"><i class="fa-solid fa-user-gear"></i> My Profile</a>
    </nav>
    <a href="#" class="nav-link" onclick="location.reload()" style="margin-top: auto; color: #ff4444; text-decoration: none;"><i class="fa-solid fa-power-off"></i> Logout</a>
</aside>

<div id="admin-content">
    <nav class="top-bar">
        <div class="menu-trigger" onclick="toggleSidebar()"><i class="fa-solid fa-bars-staggered"></i></div>
        <div class="top-logo">ECO<span>MARKET</span></div>
        <div style="width: 20px;"></div>
    </nav>

    <h2 style="margin-top:10px">Active Orders</h2>
    <input type="text" id="search-input" placeholder="Search orders...">

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Sales ID</th>
                    <th>Date</th>
                    <th>Customer</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="ordersTable"></tbody>
        </table>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, deleteDoc, addDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyDtPxmJUBCweFBswJVflEVuc4jp6-m0BVM", authDomain: "prime-dusk.firebaseapp.com", projectId: "prime-dusk" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allOrders = [], activePrefix = "";

window.toggleSidebar = () => {
    document.getElementById('sidebar').classList.toggle('active');
    document.getElementById('overlay').classList.toggle('active');
};

window.checkAuth = async () => {
    const user = document.getElementById('user-input').value.toLowerCase().trim();
    const pass = document.getElementById('pass-input').value;
    const btn = document.querySelector('.submit-btn');
    if(!user || !pass) return;
    btn.innerText = "Verifying...";
    try {
        const userSnap = await getDoc(doc(db, "users", user));
        if(userSnap.exists() && userSnap.data().password === pass) {
            const data = userSnap.data();
            activePrefix = data.username;
            document.getElementById('display-biz-name').innerText = data.business.name;
            document.getElementById('profile-initial').innerText = data.personal.fname[0].toUpperCase();
            localStorage.setItem('eco_user_prefix', activePrefix);
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            loadOrders();
        } else { alert("Invalid Credentials"); btn.innerText = "Authorize Access"; }
    } catch (e) { alert("Auth Failed"); btn.innerText = "Authorize Access"; }
};

function loadOrders() {
    onSnapshot(collection(db, `${activePrefix}_orders`), snapshot => {
        allOrders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        allOrders.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        render();
    });
}

function render() {
    const term = document.getElementById('search-input').value.toLowerCase();
    const table = document.getElementById('ordersTable');
    table.innerHTML = "";
    const filtered = allOrders.filter(o => o.customer.name.toLowerCase().includes(term) || o.customer.phone.includes(term));

    filtered.forEach(order => {
        const date = new Date(order.timestamp).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        let itemsHtml = order.items.map(item => `
            <div class="item-wrapper">
                <img src="${item.image}" class="item-thumb" onerror="this.src='https://via.placeholder.com/50'">
                <div style="flex:1"><b>${item.name}</b><br><small>x${item.qty} | ₵${item.price}</small></div>
            </div>`).join('');

        table.innerHTML += `
            <tr>
                <td data-label="ID" style="color: var(--gold); font-family: monospace; font-weight:bold;">${order.salesID || 'N/A'}</td>
                <td data-label="Date" style="color: #666;">${date}</td>
                <td data-label="Customer"><b>${order.customer.name}</b><br><small>${order.customer.phone}</small></td>
                <td data-label="Items">${itemsHtml}</td>
                <td data-label="Total" style="color: var(--gold); font-weight: bold;">₵${order.totalAmount.toFixed(2)}</td>
                <td>
                    <div class="action-btns">
                        <a href="tel:${order.customer.phone}" class="btn-action btn-call"><i class="fa-solid fa-phone"></i></a>
                        <a href="https://wa.me/233${order.customer.phone.substring(1)}" target="_blank" class="btn-action btn-wa"><i class="fa-brands fa-whatsapp"></i></a>
                        <button class="btn-action btn-del" onclick="deleteOrder('${order.id}')"><i class="fa-solid fa-check"></i> Done</button>
                    </div>
                </td>
            </tr>`;
    });
}

document.getElementById('search-input').addEventListener('input', render);

window.deleteOrder = async (id) => {
    if(!confirm("Move to history?")) return;
    try {
        const orderData = allOrders.find(o => o.id === id);
        await addDoc(collection(db, `${activePrefix}_completed_orders`), { ...orderData, completedAt: new Date().toISOString() });
        await deleteDoc(doc(db, `${activePrefix}_orders`, id));
    } catch (e) { alert("Error updating order."); }
}
</script>
</body>
</html>
