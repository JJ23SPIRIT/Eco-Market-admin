<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | EcoMarket</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --forest: #013220; --gold: #FFD700; --black: #050a05; }
        
        body { 
            font-family: 'Poppins', sans-serif; background: var(--black); color: white; 
            margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh;
            overflow: hidden;
        }

        .top-nav {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 25px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .logo { 
            font-weight: 700; 
            font-size: 1.3rem; 
            letter-spacing: 1px; 
            color: white;
            text-decoration: none;
        }
        .logo span { color: var(--gold); }

        .create-acc-btn {
            padding: 10px 22px;
            border: 1px solid var(--gold);
            color: var(--gold);
            text-decoration: none;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .create-acc-btn:hover {
            background: var(--gold);
            color: var(--forest);
        }

        .login-box { 
            background: rgba(1, 50, 32, 0.2); padding: 45px 35px; border-radius: 25px; 
            border: 1px solid var(--forest); text-align: center; width: 90%; max-width: 380px; 
            backdrop-filter: blur(15px); box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        }
        
        h1 { font-family: 'Playfair Display', serif; color: var(--gold); margin-bottom: 25px; font-size: 1.8rem; }
        
        input { 
            width: 100%; padding: 14px; margin-bottom: 15px; background: rgba(0,0,0,0.4); 
            border: 1px solid var(--forest); color: white; border-radius: 12px; 
            text-align: center; outline: none; box-sizing: border-box; font-size: 1rem;
            transition: 0.3s;
        }
        input:focus { border-color: var(--gold); background: rgba(0,0,0,0.6); }

        .submit-btn { 
            width: 100%; padding: 16px; background: var(--gold); color: var(--forest); 
            border: none; border-radius: 12px; font-weight: 800; cursor: pointer; 
            text-transform: uppercase; transition: 0.3s; margin-top: 5px;
        }
        .submit-btn:hover { background: white; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255, 215, 0, 0.2); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        #login-error {
            color: #ff4444; font-size: 0.75rem; margin-top: 10px; display: none;
        }

        @media (max-width: 600px) {
            .top-nav { padding: 20px 5%; }
            .logo { font-size: 1.1rem; }
            .create-acc-btn { padding: 8px 16px; font-size: 0.65rem; }
            .login-box { padding: 35px 25px; }
        }
    </style>
</head>
<body>

    <header class="top-nav">
        <a href="index.html" class="logo">ECO<span>MARKET</span></a>
        <a href="sign_up.html" class="create-acc-btn">Create New Account</a>
    </header>

    <div class="login-box">
        <h1>Admin Vault</h1>
        <input type="text" id="user-input" placeholder="Username" autocomplete="off">
        <input type="password" id="pass-input" placeholder="Password">
        <button class="submit-btn" id="login-btn">Authorize Access</button>
        <div id="login-error"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDtPxmJUBCweFBswJVflEVuc4jp6-m0BVM", 
            authDomain: "prime-dusk.firebaseapp.com", 
            projectId: "prime-dusk" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        document.getElementById('login-btn').onclick = async () => {
            const user = document.getElementById('user-input').value.toLowerCase().trim();
            const pass = document.getElementById('pass-input').value;
            const btn = document.getElementById('login-btn');
            const errorEl = document.getElementById('login-error');

            if(!user || !pass) { 
                errorEl.style.display = 'block';
                errorEl.innerText = "Please enter your username and password.";
                return;
            }
            
            errorEl.style.display = 'none';
            btn.innerText = "Verifying...";
            btn.disabled = true;
            
            try {
                // Get the user document to find their email
                const userSnap = await getDoc(doc(db, "users", user));

                if(!userSnap.exists()) {
                    errorEl.style.display = 'block';
                    errorEl.innerText = "Account not found. Check your username.";
                    btn.innerText = "Authorize Access";
                    btn.disabled = false;
                    return;
                }

                const data = userSnap.data();
                const email = data.personal.email;

                // Authenticate with Firebase Auth using email + password
                // The password was set when they signed up via Firebase Auth
                await signInWithEmailAndPassword(auth, email, pass);

                // Success — set session
                localStorage.setItem('eco_user_prefix', data.username);
                localStorage.setItem('eco_biz_name', data.business.name);
                localStorage.setItem('eco_user_initial', data.personal.fname[0].toUpperCase());

                window.location.href = 'orders.html';

            } catch (e) {
                console.error(e);
                let message = "Access Denied. Check your password.";
                if(e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential') {
                    message = "Invalid username or password.";
                } else if(e.code === 'auth/too-many-requests') {
                    message = "Too many attempts. Try again later.";
                } else if(e.code === 'auth/network-request-failed') {
                    message = "Network error. Check your internet.";
                }
                errorEl.style.display = 'block';
                errorEl.innerText = message;
                btn.innerText = "Authorize Access";
                btn.disabled = false;
            }
        };

        // Allow Enter key to submit
        document.getElementById('pass-input').addEventListener('keydown', (e) => {
            if(e.key === 'Enter') document.getElementById('login-btn').click();
        });
    </script>
</body>
</html>
