<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Inventory | Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --forest: #013220; --gold: #FFD700; --black: #050a05;
            --glass: rgba(255, 255, 255, 0.03); --border: rgba(1, 50, 32, 0.5);
        }
        
        body { font-family: 'Poppins', sans-serif; background: var(--black); color: white; margin: 0; }

        /* Unified Rectangular Menu Bar */
        .admin-nav { 
            background: var(--forest); padding: 15px 5%; display: flex; 
            justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--gold); position: sticky; top: 0; z-index: 100;
        }
        .nav-logo { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.4rem; font-weight: 700; }
        .nav-links { display: flex; gap: 15px; }
        .nav-item { 
            text-decoration: none; color: white; padding: 10px 20px; 
            background: rgba(255,255,255,0.05); border-radius: 8px; 
            font-size: 0.8rem; font-weight: 600; transition: 0.3s;
        }
        .nav-item:hover { background: var(--gold); color: var(--forest); }

        .content { padding: 40px 5%; }
        h2 { font-family: 'Playfair Display', serif; color: var(--gold); text-align: center; margin-bottom: 30px; font-size: 2rem; }

        .search-container { text-align: center; margin-bottom: 30px; }
        #search-input { 
            width: 100%; max-width: 600px; padding: 15px 25px; 
            background: var(--glass); border: 1px solid var(--forest); 
            border-radius: 35px; color: white; outline: none; transition: 0.3s;
        }
        #search-input:focus { border-color: var(--gold); box-shadow: 0 0 15px rgba(255, 215, 0, 0.1); }

        .table-container { background: var(--glass); border-radius: 20px; padding: 25px; border: 1px solid rgba(255,215,0,0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { padding: 15px; text-align: left; color: var(--gold); border-bottom: 2px solid var(--forest); font-size: 0.75rem; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; }
        
        .prod-id { font-family: monospace; color: var(--gold); background: rgba(255,215,0,0.1); padding: 2px 6px; border-radius: 4px; }
        .stock-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .stock-infinite { background: rgba(0, 255, 136, 0.1); color: #00ff88; }
        .stock-low { background: rgba(255, 68, 68, 0.1); color: #ff4444; }

        .del-btn { background: #ff4444; border: none; color: white; padding: 8px 15px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 0.75rem; }
        .del-btn:hover { background: white; color: #ff4444; }
        
        .prod-img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; border: 1px solid rgba(255,215,0,0.2); }
    </style>
</head>
<body>

    <nav class="admin-nav">
        <div class="nav-logo">EcoMarket Inventory</div>
        <div class="nav-links">
            <a href="index.html" class="nav-item">⬅ Active Orders</a>
            <a href="add_items.html" class="nav-item">＋ Add New Item</a>
            <a href="inventory.html" class="nav-item" style="background: var(--gold); color: var(--forest);">📋 Inventory List</a>
            <a href="completed_orders.html" class="nav-item">✅ Completed Orders</a>
            <a href="#" class="nav-item" onclick="location.reload()">🔒 Logout</a>
        </div>
    </nav>

    <div class="content">
        <h2>Manage Shop Stock</h2>

        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search by product name, ID, or category...">
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>ID</th>
                        <th>Product Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="inventory-list"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDtPxmJUBCweFBswJVflEVuc4jp6-m0BVM", authDomain: "prime-dusk.firebaseapp.com", projectId: "prime-dusk" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Multi-Admin: Get User Prefix
        const userPrefix = localStorage.getItem('eco_user_prefix');
        if(!userPrefix) {
            window.location.href = 'index.html'; // Redirect if not logged in
        }

        let masterProducts = [];

        // Dynamic Collection: prefix_products
        const productCollection = `${userPrefix}_products`;

        onSnapshot(collection(db, productCollection), snap => {
            masterProducts = snap.docs.map(doc => ({ firebaseID: doc.id, ...doc.data() }));
            renderTable(masterProducts);
        });

        function renderTable(products) {
            const list = document.getElementById('inventory-list');
            list.innerHTML = products.map(p => {
                const stockDisplay = p.unlimited ? 
                    '<span class="stock-badge stock-infinite">∞ Infinite</span>' : 
                    (p.stock <= 0 ? '<span class="stock-badge stock-low">SOLD OUT</span>' : p.stock);

                return `<tr>
                    <td><img src="${p.image}" class="prod-img" onerror="this.src='https://via.placeholder.com/50'"></td>
                    <td><span class="prod-id">${p.productID || 'N/A'}</span></td>
                    <td><strong>${p.name}</strong></td>
                    <td>${p.category}</td>
                    <td>₵${p.price}</td>
                    <td>${stockDisplay}</td>
                    <td><button class="del-btn" onclick="deleteProduct('${p.firebaseID}')">Remove</button></td>
                </tr>`;
            }).join('');
        }

        // Search Logic
        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = masterProducts.filter(p => 
                (p.name && p.name.toLowerCase().includes(term)) ||
                (p.productID && p.productID.toLowerCase().includes(term)) ||
                (p.category && p.category.toLowerCase().includes(term))
            );
            renderTable(filtered);
        });

        window.deleteProduct = async (id) => {
            if(confirm("Permanently remove this product from the shop?")) {
                await deleteDoc(doc(db, productCollection, id));
            }
        };
    </script>
</body>
</html>
