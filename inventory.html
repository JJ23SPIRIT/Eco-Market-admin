<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Inventory | EcoMarket</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --forest: #013220; --gold: #FFD700; --black: #050a05; --glass: rgba(255, 255, 255, 0.03); }
        
        body { font-family: 'Poppins', sans-serif; background: var(--black); color: white; margin: 0; overflow-x: hidden; }

        /* Modern Top Bar */
        .top-bar { 
            background: var(--forest); padding: 15px 5%; display: flex; 
            justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--gold); position: sticky; top: 0; z-index: 500;
        }
        .menu-trigger { color: var(--gold); font-size: 1.5rem; cursor: pointer; transition: 0.3s; }
        .top-logo { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.2rem; }

        /* Sliding Sidebar */
        .sidebar {
            position: fixed; top: 0; left: -300px; width: 280px; height: 100vh;
            background: rgba(1, 50, 32, 0.95); backdrop-filter: blur(15px);
            z-index: 2000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 40px 25px; border-right: 1px solid var(--gold);
            display: flex; flex-direction: column;
        }
        .sidebar.active { left: 0; }
        
        .sidebar-header { text-align: center; margin-bottom: 40px; }
        .profile-circle {
            width: 70px; height: 70px; background: var(--gold); color: var(--forest);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; font-weight: 800; margin: 0 auto 15px; border: 3px solid rgba(255,255,255,0.1);
        }
        .sidebar-biz-name { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.1rem; }

        .nav-list { list-style: none; padding: 0; flex: 1; }
        .nav-link { 
            display: flex; align-items: center; gap: 15px; padding: 15px;
            color: #ccc; text-decoration: none; border-radius: 12px;
            margin-bottom: 10px; transition: 0.3s; font-size: 0.9rem;
        }
        .nav-link i { color: var(--gold); width: 20px; text-align: center; }
        .nav-link:hover, .nav-link.active { background: rgba(255,215,0,0.1); color: white; }

        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            z-index: 1500; display: none; backdrop-filter: blur(3px);
        }
        .sidebar-overlay.active { display: block; }

        /* Inventory Content Area */
        .content { padding: 30px 5%; }
        h2 { font-family: 'Playfair Display', serif; color: var(--gold); text-align: center; font-size: 1.8rem; margin-top: 0; }

        #search-input { width: 100%; max-width: 600px; padding: 14px 20px; background: var(--glass); border: 1px solid var(--forest); border-radius: 30px; color: white; outline: none; display: block; margin: 25px auto; }

        .table-container { background: var(--glass); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,215,0,0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { padding: 12px; text-align: left; color: var(--gold); border-bottom: 2px solid var(--forest); font-size: 0.7rem; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; vertical-align: middle; }
        
        .prod-id { font-family: monospace; color: var(--gold); background: rgba(255,215,0,0.1); padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; }
        .stock-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
        .stock-infinite { background: rgba(0, 255, 136, 0.1); color: #00ff88; }
        .stock-low { background: rgba(255, 68, 68, 0.1); color: #ff4444; }

        .del-btn { background: #ff4444; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 0.75rem; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .del-btn:hover { background: white; color: #ff4444; }
        
        .prod-img { width: 50px; height: 50px; object-fit: cover; border-radius: 10px; border: 1px solid rgba(255,215,0,0.2); }

        /* 📱 RESPONSIVE MOBILE TRANSFORMATION */
        @media (max-width: 850px) {
            .top-bar { padding: 15px 20px; }
            .content { padding: 20px 15px; }
            
            thead { display: none; }
            
            tr { 
                display: block; background: rgba(255,255,255,0.03); 
                margin-bottom: 20px; border-radius: 20px; padding: 20px;
                border: 1px solid rgba(255,215,0,0.05);
            }

            td { 
                display: block; padding: 10px 0; border: none; 
                text-align: left; position: relative; padding-left: 45%;
            }

            td::before { 
                content: attr(data-label); position: absolute; left: 0; 
                font-weight: 600; color: var(--gold); font-size: 0.7rem; 
                text-transform: uppercase; 
            }

            td:first-child { padding-left: 0; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 10px; padding-bottom: 15px; }
            td:first-child::before { display: none; }
            .prod-img { width: 80px; height: 80px; }

            td:last-child { border-top: 1px solid rgba(255,255,255,0.05); margin-top: 10px; padding-top: 15px; padding-left: 0; }
            td:last-child::before { display: none; }
            .del-btn { width: 100%; justify-content: center; padding: 14px; }
        }
    </style>
</head>
<body>

<!-- Sidebar Navigation -->
<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="profile-circle" id="profile-initial">?</div>
        <div class="sidebar-biz-name" id="display-biz-name">Inventory Portal</div>
    </div>
    
    <nav class="nav-list">
        <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Active Orders</a>
        <a href="add_items.html" class="nav-link"><i class="fa-solid fa-plus"></i> Add New Item</a>
        <a href="#" class="nav-link active" onclick="toggleSidebar()"><i class="fa-solid fa-boxes-stacked"></i> Inventory</a>
        <a href="completed_orders.html" class="nav-link"><i class="fa-solid fa-check-double"></i> Completed Orders</a>
        <a href="profile.html" class="nav-link"><i class="fa-solid fa-user-gear"></i> My Profile</a>
    </nav>

    <a href="#" class="nav-link" onclick="localStorage.removeItem('eco_user_prefix'); location.href='index.html'" style="margin-top: auto; color: #ff4444;">
        <i class="fa-solid fa-power-off"></i> Logout
    </a>
</aside>

<div class="top-bar">
    <div class="menu-trigger" onclick="toggleSidebar()"><i class="fa-solid fa-bars-staggered"></i></div>
    <div class="top-logo">ECO<span>MARKET</span></div>
    <div style="width: 25px;"></div>
</div>

<div class="content">
    <h2>Shop Inventory</h2>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="Search by name, ID, or category...">
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Image</th>
                    <th>ID</th>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="inventory-list"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyDtPxmJUBCweFBswJVflEVuc4jp6-m0BVM", authDomain: "prime-dusk.firebaseapp.com", projectId: "prime-dusk" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const userPrefix = localStorage.getItem('eco_user_prefix');
    if(!userPrefix) window.location.href = 'index.html';

    window.toggleSidebar = () => {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    };

    async function loadHeader() {
        const userSnap = await getDoc(doc(db, "users", userPrefix));
        if(userSnap.exists()) {
            const data = userSnap.data();
            document.getElementById('display-biz-name').innerText = data.business.name;
            document.getElementById('profile-initial').innerText = data.personal.fname[0].toUpperCase();
        }
    }
    loadHeader();

    let masterProducts = [];
    const productCollection = `${userPrefix}_products`;

    onSnapshot(collection(db, productCollection), snap => {
        masterProducts = snap.docs.map(doc => ({ firebaseID: doc.id, ...doc.data() }));
        renderTable(masterProducts);
    });

    function renderTable(products) {
        const list = document.getElementById('inventory-list');
        list.innerHTML = products.map(p => {
            const stockDisplay = p.unlimited ? 
                '<span class="stock-badge stock-infinite">∞ Infinite</span>' : 
                (p.stock <= 0 ? '<span class="stock-badge stock-low">SOLD OUT</span>' : p.stock);

            return `<tr>
                <td><img src="${p.image}" class="prod-img" onerror="this.src='https://via.placeholder.com/50'"></td>
                <td data-label="ID"><span class="prod-id">${p.productID || 'N/A'}</span></td>
                <td data-label="Name"><strong>${p.name}</strong></td>
                <td data-label="Category">${p.category}</td>
                <td data-label="Price">₵${p.price.toFixed(2)}</td>
                <td data-label="Stock">${stockDisplay}</td>
                <td>
                    <button class="del-btn" onclick="deleteProduct('${p.firebaseID}')">
                        <i class="fa-solid fa-trash"></i> Remove
                    </button>
                </td>
            </tr>`;
        }).join('');
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = masterProducts.filter(p => 
            (p.name && p.name.toLowerCase().includes(term)) ||
            (p.productID && p.productID.toLowerCase().includes(term)) ||
            (p.category && p.category.toLowerCase().includes(term))
        );
        renderTable(filtered);
    });

    window.deleteProduct = async (id) => {
        if(confirm("Permanently remove this product from the shop?")) {
            await deleteDoc(doc(db, productCollection, id));
        }
    };
</script>
</body>
</html>
