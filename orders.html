<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Orders | Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --forest: #013220; --gold: #FFD700; --black: #050a05; --glass: rgba(255, 255, 255, 0.03); }
        body { font-family: 'Poppins', sans-serif; background: var(--black); color: white; margin: 0; overflow-x: hidden; }

        /* Compact Top Bar */
        .top-bar { 
            background: var(--forest); padding: 12px 5%; display: flex; 
            justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--gold); position: sticky; top: 0; z-index: 500;
        }
        .menu-trigger { color: var(--gold); font-size: 1.3rem; cursor: pointer; }
        .top-logo { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.1rem; }

        /* Sliding Sidebar */
        .sidebar {
            position: fixed; top: 0; left: -300px; width: 260px; height: 100vh;
            background: rgba(1, 50, 32, 0.98); backdrop-filter: blur(15px);
            z-index: 2000; transition: 0.4s ease;
            padding: 30px 20px; border-right: 1px solid var(--gold);
            display: flex; flex-direction: column;
        }
        .sidebar.active { left: 0; }
        .sidebar-header { text-align: center; margin-bottom: 30px; }
        .profile-circle {
            width: 60px; height: 60px; background: var(--gold); color: var(--forest);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: 800; margin: 0 auto 10px; border: 2px solid rgba(255,255,255,0.1);
        }
        .sidebar-biz-name { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1rem; }
        .nav-link { 
            display: flex; align-items: center; gap: 12px; padding: 14px;
            color: #ccc; text-decoration: none; border-radius: 10px;
            margin-bottom: 5px; transition: 0.2s; font-size: 0.85rem;
        }
        .nav-link i { color: var(--gold); width: 18px; text-align: center; }
        .nav-link:hover, .nav-link.active { background: rgba(255,215,0,0.1); color: white; }

        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1500; display: none; }
        .sidebar-overlay.active { display: block; }

        /* Content Area */
        #admin-content { padding: 20px 4%; }
        h2 { font-family: 'Playfair Display', serif; color: var(--gold); text-align: center; font-size: 1.5rem; margin: 0; margin-bottom: 20px; }
        #search-input { width: 100%; max-width: 500px; padding: 12px 20px; background: var(--glass); border: 1px solid var(--forest); border-radius: 25px; color: white; outline: none; display: block; margin: 15px auto; font-size: 0.85rem; }

        .table-container { background: var(--glass); border-radius: 15px; padding: 15px; border: 1px solid rgba(255,215,0,0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { padding: 12px; text-align: left; color: var(--gold); border-bottom: 2px solid var(--forest); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 15px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; vertical-align: middle; }

        .item-wrapper { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; padding: 6px; border-radius: 8px; background: rgba(255,255,255,0.02); }
        .item-thumb { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; border: 1px solid rgba(255,215,0,0.2); }
        
        .action-btns { display: flex; gap: 8px; }
        .btn-action { width: 42px; height: 42px; border-radius: 10px; text-decoration: none; font-size: 0.9rem; border: none; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .btn-call { background: #007bff; }
        .btn-wa { background: #25D366; }
        .btn-del { background: var(--gold); color: var(--forest); width: auto; padding: 0 15px; font-weight: bold; font-size: 0.75rem; text-transform: uppercase; }

        /* MOBILE OPTIMIZATION */
        @media (max-width: 850px) {
            table { min-width: 100%; }
            th { display: none; }
            tr { display: block; background: rgba(255,255,255,0.02); margin-bottom: 15px; border-radius: 15px; padding: 15px; border: 1px solid rgba(255,215,0,0.05); }
            td { display: block; padding: 8px 0; border: none; text-align: left; position: relative; padding-left: 35%; min-height: 25px; }
            td::before { content: attr(data-label); position: absolute; left: 0; font-weight: 600; color: var(--gold); font-size: 0.6rem; text-transform: uppercase; opacity: 0.7; }
            td:last-child { border-top: 1px solid rgba(255,255,255,0.05); margin-top: 10px; padding-top: 15px; padding-left: 0; }
            td:last-child::before { display: none; }
            .btn-action { flex: 1; height: 48px; }
            .btn-del { flex: 2; }
        }
    </style>
</head>
<body>

<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="profile-circle" id="profile-initial">?</div>
        <div class="sidebar-biz-name" id="display-biz-name">Admin Portal</div>
    </div>
    <nav class="nav-list">
        <a href="#" class="nav-link active" onclick="toggleSidebar()"><i class="fa-solid fa-house"></i> Active Orders</a>
        <a href="add_items.html" class="nav-link"><i class="fa-solid fa-plus"></i> Add New Item</a>
        <a href="inventory.html" class="nav-link"><i class="fa-solid fa-boxes-stacked"></i> Inventory</a>
        <a href="completed_orders.html" class="nav-link"><i class="fa-solid fa-check-double"></i> Completed Orders</a>
        <a href="profile.html" class="nav-link"><i class="fa-solid fa-user-gear"></i> My Profile</a>
    </nav>
    <a href="#" class="nav-link" id="logout-btn" style="margin-top: auto; color: #ff4444; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px;"><i class="fa-solid fa-power-off"></i> Logout</a>
</aside>

<div id="admin-content">
    <nav class="top-bar">
        <div class="menu-trigger" onclick="toggleSidebar()"><i class="fa-solid fa-bars-staggered"></i></div>
        <div class="top-logo">ECO<span>MARKET</span></div>
        <div style="width: 20px;"></div>
    </nav>

    <h2 style="margin-top:20px">Active Orders</h2>
    <input type="text" id="search-input" placeholder="Search customer or phone...">

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Date</th>
                    <th>Customer</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="ordersTable"></tbody>
        </table>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyDtPxmJUBCweFBswJVflEVuc4jp6-m0BVM", authDomain: "prime-dusk.firebaseapp.com", projectId: "prime-dusk" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// SECURITY GUARD: PERSISTENT SESSION CHECK
const activePrefix = localStorage.getItem('eco_user_prefix');
if(!activePrefix) {
    window.location.href = 'index.html';
}

// SETUP HEADER
document.getElementById('display-biz-name').innerText = localStorage.getItem('eco_biz_name') || "Admin Portal";
document.getElementById('profile-initial').innerText = localStorage.getItem('eco_user_initial') || "?";

window.toggleSidebar = () => {
    document.getElementById('sidebar').classList.toggle('active');
    document.getElementById('overlay').classList.toggle('active');
};

document.getElementById('logout-btn').onclick = () => {
    localStorage.clear();
    window.location.href = 'index.html';
};

let allOrders = [];

function loadOrders() {
    onSnapshot(collection(db, `${activePrefix}_orders`), snapshot => {
        allOrders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        allOrders.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        render();
    });
}
loadOrders();

function render() {
    const term = document.getElementById('search-input').value.toLowerCase();
    const table = document.getElementById('ordersTable');
    table.innerHTML = "";
    
    const filtered = allOrders.filter(o => 
        o.customer.name.toLowerCase().includes(term) || 
        o.customer.phone.includes(term)
    );

    filtered.forEach(order => {
        const date = new Date(order.timestamp).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        
        // WhatsApp Logic: Ensure 233 prefix and no leading zero
        const cleanPhone = order.customer.phone.replace(/\D/g, '');
        const waPhone = cleanPhone.startsWith('0') ? '233' + cleanPhone.substring(1) : cleanPhone.startsWith('233') ? cleanPhone : '233' + cleanPhone;

        let itemsHtml = order.items.map(item => `
            <div class="item-wrapper">
                <img src="${item.image}" class="item-thumb" onerror="this.src='https://via.placeholder.com/50'">
                <div style="flex:1"><b>${item.name}</b><br><small>Qty: ${item.qty} | ₵${item.price}</small></div>
            </div>`).join('');

        table.innerHTML += `
            <tr>
                <td data-label="Order ID" style="color: var(--gold); font-family: monospace; font-weight:bold;">${order.salesID || 'N/A'}</td>
                <td data-label="Date" style="color: #888;">${date}</td>
                <td data-label="Customer"><b>${order.customer.name}</b><br><small>${order.customer.phone}</small></td>
                <td data-label="Items">${itemsHtml}</td>
                <td data-label="Total" style="color: var(--gold); font-weight: bold;">₵${order.totalAmount.toFixed(2)}</td>
                <td>
                    <div class="action-btns">
                        <a href="tel:${order.customer.phone}" class="btn-action btn-call"><i class="fa-solid fa-phone"></i></a>
                        <a href="https://wa.me/${waPhone}" target="_blank" class="btn-action btn-wa"><i class="fa-brands fa-whatsapp"></i></a>
                        <button class="btn-action btn-del" onclick="deleteOrder('${order.id}')"><i class="fa-solid fa-check"></i> Done</button>
                    </div>
                </td>
            </tr>`;
    });
}

document.getElementById('search-input').addEventListener('input', render);

window.deleteOrder = async (id) => {
    if(!confirm("Move this order to History?")) return;
    try {
        const orderData = allOrders.find(o => o.id === id);
        await addDoc(collection(db, `${activePrefix}_completed_orders`), { 
            ...orderData, 
            completedAt: new Date().toISOString() 
        });
        await deleteDoc(doc(db, `${activePrefix}_orders`, id));
    } catch (e) { alert("Error completing order."); }
}
</script>
</body>
</html>
