<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Orders | Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --forest: #013220; --gold: #FFD700; --black: #050a05; --glass: rgba(255, 255, 255, 0.03); }
        body { font-family: 'Poppins', sans-serif; background: var(--black); color: white; margin: 0; overflow-x: hidden; }

        /* Top Bar */
        .top-bar { 
            background: var(--forest); padding: 12px 5%; display: flex; 
            justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--gold); position: sticky; top: 0; z-index: 500;
        }
        .menu-trigger { color: var(--gold); font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .menu-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        /* Sidebar */
        .sidebar {
            position: fixed; top: 0; left: -300px; width: 260px; height: 100vh;
            background: rgba(1, 50, 32, 0.98); backdrop-filter: blur(15px);
            z-index: 2000; transition: 0.4s ease;
            padding: 30px 20px; border-right: 1px solid var(--gold);
            display: flex; flex-direction: column;
        }
        .sidebar.active { left: 0; }
        .sidebar-header { text-align: center; margin-bottom: 30px; }
        .profile-circle {
            width: 60px; height: 60px; background: var(--gold); color: var(--forest);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: 800; margin: 0 auto 10px; border: 2px solid rgba(255,255,255,0.1);
        }
        .nav-link { 
            display: flex; align-items: center; gap: 12px; padding: 14px;
            color: #ccc; text-decoration: none; border-radius: 10px;
            margin-bottom: 5px; transition: 0.2s; font-size: 0.85rem;
        }
        .nav-link.active { background: rgba(255,215,0,0.1); color: white; }
        .nav-badge { background: var(--gold); color: var(--forest); font-size: 0.65rem; padding: 2px 7px; border-radius: 50px; font-weight: 800; margin-left: auto; }

        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1500; display: none; }
        .sidebar-overlay.active { display: block; }

        /* Content Area */
        #admin-content { padding: 20px 4%; }
        h2 { font-family: 'Playfair Display', serif; color: var(--gold); text-align: center; font-size: 1.5rem; margin-bottom: 10px; }
        
        /* Stats Pill */
        .stats-pill { display: inline-block; background: rgba(255,215,0,0.1); border: 1px solid var(--gold); color: var(--gold); padding: 5px 15px; border-radius: 50px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }

        /* Adjusted Search Bar */
        #search-input { 
            width: 90%; max-width: 320px; padding: 12px 20px; 
            background: var(--glass); border: 1px solid var(--forest); 
            border-radius: 30px; color: white; outline: none; 
            display: block; margin: 0 auto 25px; font-size: 0.85rem; text-align: center;
        }

        .table-container { background: var(--glass); border-radius: 15px; padding: 15px; border: 1px solid rgba(255,215,0,0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { padding: 12px; text-align: left; color: var(--gold); border-bottom: 2px solid var(--forest); font-size: 0.7rem; text-transform: uppercase; }
        td { padding: 15px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; }

        .item-wrapper { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; padding: 4px; border-radius: 6px; background: rgba(255,255,255,0.02); }
        .item-thumb { width: 35px; height: 35px; border-radius: 5px; object-fit: cover; }
        
        .action-btns { display: flex; gap: 8px; }
        .btn-action { width: 40px; height: 40px; border-radius: 10px; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; text-decoration: none; }
        .btn-call { background: #007bff; }
        .btn-wa { background: #25D366; }
        .btn-done { background: var(--gold); color: var(--forest); font-weight: bold; width: auto; padding: 0 15px; font-size: 0.75rem; }

        @media (max-width: 850px) {
            th { display: none; }
            tr { display: block; background: rgba(255,255,255,0.02); margin-bottom: 15px; border-radius: 15px; padding: 15px; border: 1px solid rgba(255,215,0,0.05); }
            td { display: block; padding: 8px 0; border: none; position: relative; padding-left: 35%; min-height: 25px; }
            td::before { content: attr(data-label); position: absolute; left: 0; color: var(--gold); font-size: 0.6rem; font-weight: 700; text-transform: uppercase; }
            td:last-child { border-top: 1px solid rgba(255,255,255,0.05); margin-top: 10px; padding-top: 15px; padding-left: 0; }
            td:last-child::before { display: none; }
            .btn-action { flex: 1; height: 45px; }
        }
    </style>
</head>
<body>

<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="profile-circle" id="profile-initial">?</div>
        <div id="display-biz-name" style="color: var(--gold); font-family: 'Playfair Display';">Admin</div>
    </div>
    <nav>
        <a href="#" class="nav-link active">
            <i class="fa-solid fa-house"></i> Active Orders
            <span class="nav-badge" id="side-count">0</span>
        </a>
        <a href="add_items.html" class="nav-link"><i class="fa-solid fa-plus"></i> Add New Item</a>
        <a href="inventory.html" class="nav-link"><i class="fa-solid fa-boxes-stacked"></i> Inventory</a>
        <a href="completed_orders.html" class="nav-link"><i class="fa-solid fa-check-double"></i> History</a>
        <a href="profile.html" class="nav-link"><i class="fa-solid fa-user-gear"></i> My Profile</a>
    </nav>
    <a href="#" class="nav-link" onclick="localStorage.clear(); location.href='index.html'" style="margin-top: auto; color: #ff4444;"><i class="fa-solid fa-power-off"></i> Logout</a>
</aside>

<div id="admin-content">
    <div class="top-bar">
        <div class="menu-trigger" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars-staggered"></i>
            <span class="menu-label">Menu</span>
        </div>
        <div style="font-family: 'Playfair Display'; color: var(--gold); font-weight:bold;">ECO<span>MARKET</span></div>
        <div style="width: 25px;"></div>
    </div>

    <div style="text-align: center; margin-top: 20px;">
        <h2>Active Orders</h2>
        <div class="stats-pill"><span id="top-count">0</span> Active Orders</div>
    </div>

    <input type="text" id="search-input" placeholder="Search customer or phone...">

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Action</th>
                </tr>
            </thead>
            <tbody id="ordersTable"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyDtPxmJUBCweFBswJVflEVuc4jp6-m0BVM", authDomain: "prime-dusk.firebaseapp.com", projectId: "prime-dusk" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const activePrefix = localStorage.getItem('eco_user_prefix');
    if(!activePrefix) window.location.href = 'index.html';

    document.getElementById('display-biz-name').innerText = localStorage.getItem('eco_biz_name');
    document.getElementById('profile-initial').innerText = localStorage.getItem('eco_user_initial');

    window.toggleSidebar = () => {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    };

    let allOrders = [];

    onSnapshot(collection(db, `${activePrefix}_orders`), snap => {
        allOrders = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        allOrders.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        
        // Update Counters
        const count = allOrders.length;
        document.getElementById('top-count').innerText = count;
        document.getElementById('side-count').innerText = count;
        
        render();
    });

    function render() {
        const table = document.getElementById('ordersTable');
        const term = document.getElementById('search-input').value.toLowerCase();
        table.innerHTML = "";

        const filtered = allOrders.filter(o => o.customer.name.toLowerCase().includes(term) || o.customer.phone.includes(term));

        filtered.forEach(order => {
            const date = new Date(order.timestamp).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            
            const cleanPhone = order.customer.phone.replace(/\D/g, '');
            const waPhone = cleanPhone.startsWith('0') ? '233' + cleanPhone.substring(1) : cleanPhone;

            let itemsHtml = order.items.map(item => `
                <div class="item-wrapper">
                    <img src="${item.image}" class="item-thumb" onerror="this.src='https://via.placeholder.com/40'">
                    <div style="flex:1"><b>${item.name}</b><br><small>x${item.qty} | ₵${item.price}</small></div>
                </div>`).join('');

            table.innerHTML += `
                <tr>
                    <td data-label="ID" style="color:var(--gold); font-family:monospace;">${order.salesID || 'N/A'}</td>
                    <td data-label="Date" style="color:#888;">${date}</td>
                    <td data-label="Customer"><b>${order.customer.name}</b><br><small>${order.customer.phone}</small></td>
                    <td data-label="Items">${itemsHtml}</td>
                    <td data-label="Total" style="color:var(--gold); font-weight:800;">₵${order.totalAmount.toFixed(2)}</td>
                    <td>
                        <div class="action-btns">
                            <a href="tel:${order.customer.phone}" class="btn-action btn-call"><i class="fa-solid fa-phone"></i></a>
                            <a href="https://wa.me/${waPhone}" target="_blank" class="btn-action btn-wa"><i class="fa-brands fa-whatsapp"></i></a>
                            <button class="btn-action btn-done" onclick="completeOrder('${order.id}')">Done</button>
                        </div>
                    </td>
                </tr>`;
        });
    }

    document.getElementById('search-input').oninput = render;

    window.completeOrder = async (id) => {
        if(!confirm("Complete and move to history?")) return;
        const orderData = allOrders.find(o => o.id === id);
        try {
            await addDoc(collection(db, `${activePrefix}_completed_orders`), { ...orderData, completedAt: new Date().toISOString() });
            await deleteDoc(doc(db, `${activePrefix}_orders`, id));
        } catch (e) { alert("Error updating order."); }
    };
</script>
</body>
</html>
