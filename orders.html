<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Orders | Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --forest: #013220; --gold: #FFD700; --black: #050a05; --glass: rgba(255, 255, 255, 0.03); --border: rgba(255, 215, 0, 0.15); }
        body { font-family: 'Poppins', sans-serif; background: var(--black); color: white; margin: 0; overflow-x: hidden; }

        /* Navigation */
        .top-bar { background: var(--forest); padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gold); position: sticky; top: 0; z-index: 500; }
        .menu-trigger { color: var(--gold); font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .menu-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        /* Sidebar */
        .sidebar { position: fixed; top: 0; left: -300px; width: 260px; height: 100vh; background: rgba(1, 50, 32, 0.98); backdrop-filter: blur(15px); z-index: 2000; transition: 0.4s ease; padding: 30px 20px; border-right: 1px solid var(--gold); }
        .sidebar.active { left: 0; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 14px; color: #ccc; text-decoration: none; border-radius: 10px; margin-bottom: 5px; font-size: 0.85rem; }
        .nav-link.active { background: rgba(255,215,0,0.1); color: white; }
        .nav-badge { background: var(--gold); color: var(--forest); font-size: 0.65rem; padding: 2px 7px; border-radius: 50px; font-weight: 800; margin-left: auto; }
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1500; display: none; }
        .sidebar-overlay.active { display: block; }

        /* Main Content */
        #admin-content { padding: 20px 4%; text-align: center; }
        h2 { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.5rem; margin-bottom: 5px; }
        .stats-pill { display: inline-block; background: rgba(255,215,0,0.1); border: 1px solid var(--gold); color: var(--gold); padding: 5px 15px; border-radius: 50px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; margin-bottom: 15px; }
        #search-input { width: 90%; max-width: 320px; padding: 12px 20px; background: var(--glass); border: 1px solid var(--forest); border-radius: 30px; color: white; outline: none; display: block; margin: 0 auto 30px; text-align: center; font-size: 0.85rem; }

        /* ORDER GRID (FOLDER STYLE) */
        .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        
        .order-folder { background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 15px; text-align: center; transition: 0.3s; cursor: pointer; position: relative; overflow: hidden; }
        .order-folder:active { transform: scale(0.95); }
        .order-folder::after { content: ''; position: absolute; top: 0; right: 0; width: 30px; height: 30px; background: linear-gradient(135deg, transparent 50%, rgba(255,215,0,0.1) 50%); }

        .customer-avatar { width: 60px; height: 60px; background: var(--gold); color: var(--forest); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 800; margin: 0 auto 12px; border: 2px solid rgba(255,255,255,0.1); }
        .order-name { font-weight: 600; font-size: 0.85rem; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .order-meta { font-family: monospace; font-size: 0.65rem; color: #888; margin-bottom: 8px; }
        .order-total { color: var(--gold); font-weight: 800; font-size: 0.9rem; }

        /* DETAIL MODAL */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; display: none; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(10px); }
        .modal-content { background: var(--forest); border: 1px solid var(--gold); border-radius: 25px; width: 100%; max-width: 450px; overflow: hidden; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-header { padding: 25px; border-bottom: 1px solid rgba(255,215,0,0.1); text-align: center; }
        .modal-body { padding: 20px; max-height: 60vh; overflow-y: auto; }
        
        .item-row { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .item-img { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; }
        
        .modal-footer { padding: 20px; background: rgba(0,0,0,0.2); border-top: 1px solid rgba(255,215,0,0.1); }
        .action-btns { display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 10px; }
        .btn-action { height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; border: none; font-size: 1rem; cursor: pointer; }
        .btn-call { background: #007bff; }
        .btn-wa { background: #25D366; }
        .btn-done { background: var(--gold); color: var(--forest); font-weight: 800; font-size: 0.75rem; text-transform: uppercase; }

        .close-btn { position: absolute; top: 15px; right: 15px; color: white; cursor: pointer; font-size: 1.2rem; z-index: 10; }

        @media (max-width: 480px) { .orders-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }
    </style>
</head>
<body>

<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div id="profile-initial" style="width: 60px; height: 60px; background: var(--gold); color: var(--forest); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800; margin: 0 auto 10px; border: 2px solid white;">?</div>
        <div id="display-biz-name" style="color: var(--gold); font-family: 'Playfair Display';">Admin</div>
    </div>
    <nav>
        <a href="#" class="nav-link active">
            <i class="fa-solid fa-house"></i> Active Orders
            <span class="nav-badge" id="side-count">0</span>
        </a>
        <a href="add_items.html" class="nav-link"><i class="fa-solid fa-plus"></i> Add New Item</a>
        <a href="inventory.html" class="nav-link"><i class="fa-solid fa-boxes-stacked"></i> Inventory</a>
        <a href="completed_orders.html" class="nav-link"><i class="fa-solid fa-check-double"></i> History</a>
        <a href="profile.html" class="nav-link"><i class="fa-solid fa-user-gear"></i> My Profile</a>
    </nav>
    <a href="#" class="nav-link" onclick="localStorage.clear(); location.href='index.html'" style="margin-top: auto; color: #ff4444;"><i class="fa-solid fa-power-off"></i> Logout</a>
</aside>

<!-- ORDER DETAIL MODAL -->
<div class="modal" id="orderModal">
    <div class="modal-content">
        <div class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></div>
        <div class="modal-header">
            <div class="customer-avatar" id="m-avatar">?</div>
            <h3 id="m-name" style="margin:0; font-family:'Playfair Display'; color:var(--gold);">Customer Name</h3>
            <p id="m-phone" style="color:#888; font-size:0.8rem; margin:5px 0;"></p>
            <div class="order-meta" id="m-id">ID: 000000</div>
        </div>
        <div class="modal-body" id="m-items">
            <!-- Items injected here -->
        </div>
        <div class="modal-footer">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:800;">
                <span>Total Amount:</span>
                <span id="m-total" style="color:var(--gold); font-size:1.2rem;">₵0.00</span>
            </div>
            <div class="action-btns">
                <a href="" id="m-call" class="btn-action btn-call"><i class="fa-solid fa-phone"></i></a>
                <a href="" id="m-wa" target="_blank" class="btn-action btn-wa"><i class="fa-brands fa-whatsapp"></i></a>
                <button id="m-done" class="btn-action btn-done">Complete</button>
            </div>
        </div>
    </div>
</div>

<div id="admin-content">
    <div class="top-bar">
        <div class="menu-trigger" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars-staggered"></i>
            <span class="menu-label">Menu</span>
        </div>
        <div style="font-family: 'Playfair Display'; color: var(--gold); font-weight:bold;">ECO<span>MARKET</span></div>
        <div style="width: 25px;"></div>
    </div>

    <div style="margin-top: 20px;">
        <h2>Active Orders</h2>
        <div class="stats-pill"><span id="top-count">0</span> Active Orders</div>
    </div>

    <input type="text" id="search-input" placeholder="Search customer or phone...">

    <div class="orders-grid" id="orders-list">
        <!-- Order Folders injected here -->
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyDtPxmJUBCweFBswJVflEVuc4jp6-m0BVM", authDomain: "prime-dusk.firebaseapp.com", projectId: "prime-dusk" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const activePrefix = localStorage.getItem('eco_user_prefix');
    if(!activePrefix) window.location.href = 'index.html';

    document.getElementById('display-biz-name').innerText = localStorage.getItem('eco_biz_name');
    document.getElementById('profile-initial').innerText = localStorage.getItem('eco_user_initial');

    window.toggleSidebar = () => {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    };

    let allOrders = [], selectedID = null;

    onSnapshot(collection(db, `${activePrefix}_orders`), snap => {
        allOrders = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        allOrders.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        
        const count = allOrders.length;
        document.getElementById('top-count').innerText = count;
        document.getElementById('side-count').innerText = count;
        
        render();
    });

    function render() {
        const list = document.getElementById('orders-list');
        const term = document.getElementById('search-input').value.toLowerCase();
        
        const filtered = allOrders.filter(o => o.customer.name.toLowerCase().includes(term) || o.customer.phone.includes(term));

        list.innerHTML = filtered.map(o => {
            const initial = o.customer.name.charAt(0).toUpperCase();
            return `
                <div class="order-folder" onclick="openOrder('${o.id}')">
                    <div class="customer-avatar">${initial}</div>
                    <div class="order-name">${o.customer.name}</div>
                    <div class="order-meta">${o.salesID || 'NO ID'}</div>
                    <div class="order-total">₵${o.totalAmount.toFixed(2)}</div>
                </div>
            `;
        }).join('');
    }

    document.getElementById('search-input').oninput = render;

    window.openOrder = (id) => {
        selectedID = id;
        const o = allOrders.find(x => x.id === id);
        
        document.getElementById('m-avatar').innerText = o.customer.name.charAt(0).toUpperCase();
        document.getElementById('m-name').innerText = o.customer.name;
        document.getElementById('m-phone').innerText = o.customer.phone;
        document.getElementById('m-id').innerText = "ORDER ID: " + (o.salesID || 'N/A');
        document.getElementById('m-total').innerText = "₵" + o.totalAmount.toFixed(2);
        
        // Actions
        const cleanPhone = o.customer.phone.replace(/\D/g, '');
        const waPhone = cleanPhone.startsWith('0') ? '233' + cleanPhone.substring(1) : cleanPhone;
        document.getElementById('m-call').href = "tel:" + o.customer.phone;
        document.getElementById('m-wa').href = "https://wa.me/" + waPhone;
        
        // Items
        document.getElementById('m-items').innerHTML = o.items.map(i => `
            <div class="item-row">
                <img src="${i.image}" class="item-img" onerror="this.src='https://via.placeholder.com/50'">
                <div style="flex:1">
                    <div style="font-size:0.85rem; font-weight:600;">${i.name}</div>
                    <div style="font-size:0.7rem; color:#aaa;">Qty: ${i.qty} | ₵${i.price}</div>
                </div>
                <div style="font-weight:700; color:var(--gold);">₵${(i.qty * i.price).toFixed(2)}</div>
            </div>
        `).join('');

        document.getElementById('m-done').onclick = () => finishOrder(id);
        document.getElementById('orderModal').style.display = 'flex';
    };

    window.closeModal = () => { document.getElementById('orderModal').style.display = 'none'; };

    async function finishOrder(id) {
        if(!confirm("Complete and move to history?")) return;
        const oData = allOrders.find(o => o.id === id);
        try {
            await addDoc(collection(db, `${activePrefix}_completed_orders`), { ...oData, completedAt: new Date().toISOString() });
            await deleteDoc(doc(db, `${activePrefix}_orders`, id));
            closeModal();
        } catch (e) { alert("Error completing order."); }
    }
</script>
</body>
</html>
