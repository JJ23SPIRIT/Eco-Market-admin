<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | EcoMarket Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --forest: #013220; --gold: #FFD700; --black: #050a05; --glass: rgba(255, 255, 255, 0.03); --border: rgba(255, 215, 0, 0.15); }
        
        body { font-family: 'Poppins', sans-serif; background: var(--black); color: white; margin: 0; overflow-x: hidden; }

        /* Top Bar */
        .top-bar { 
            background: var(--forest); padding: 12px 5%; display: flex; 
            justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--gold); position: sticky; top: 0; z-index: 500;
        }
        .top-logo { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.1rem; }

        /* Content Area */
        .container { max-width: 850px; margin: 20px auto; padding: 0 4%; padding-bottom: 50px; }
        
        .profile-header { text-align: center; margin-bottom: 30px; }
        .avatar-wrapper { position: relative; width: 110px; height: 110px; margin: 0 auto 15px; }
        #profile-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); background: #111; }
        .upload-label { position: absolute; bottom: 5px; right: 5px; background: var(--gold); color: var(--forest); width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; border: 2px solid var(--black); font-size: 0.8rem; }

        .card { background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 25px; margin-bottom: 25px; }
        h3 { color: var(--gold); font-family: 'Playfair Display', serif; font-size: 1.2rem; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        h3 i { font-size: 0.9rem; opacity: 0.7; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .field { margin-bottom: 12px; }
        label { display: block; font-size: 0.65rem; color: #888; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 1px; font-weight: 600; }
        
        input, textarea, select { 
            width: 100%; padding: 13px; background: rgba(0,0,0,0.3); 
            border: 1px solid #333; border-radius: 10px; color: white; outline: none; box-sizing: border-box; font-size: 0.9rem; transition: 0.3s;
        }
        input:focus { border-color: var(--gold); }
        
        /* Read-Only Styling */
        input[readonly] { background: rgba(255,255,255,0.02); color: #777; border: 1px dashed #444; cursor: not-allowed; font-family: monospace; }

        /* Password Wrapper */
        .pass-container { position: relative; }
        .eye-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--gold); cursor: pointer; opacity: 0.6; }

        /* ID Preview */
        .id-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
        .id-card-view { width: 100%; height: 140px; border-radius: 12px; object-fit: cover; border: 1px solid #333; background: #111; }

        .save-btn { width: 100%; padding: 18px; background: var(--gold); color: var(--forest); border: none; border-radius: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 0.9rem; margin-top: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        
        #upload-progress { height: 4px; background: var(--gold); width: 0%; margin-top: 10px; transition: 0.3s; border-radius: 2px; }

        @media (max-width: 850px) {
            .grid, .id-grid { grid-template-columns: 1fr; }
            .card { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="orders.html" style="color: var(--gold);"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="top-logo">ECO<span>MARKET</span></div>
    <div style="width: 25px;"></div>
</div>

<div class="container">
    <div class="profile-header">
        <div class="avatar-wrapper">
            <img id="profile-img" src="https://via.placeholder.com/120?text=User">
            <label for="file-input" class="upload-label"><i class="fa-solid fa-camera"></i></label>
            <input type="file" id="file-input" hidden accept="image/*">
        </div>
        <div id="upload-progress"></div>
        <h2 id="header-fullname" style="margin-bottom: 5px;">Vendor Name</h2>
        <p style="color: var(--gold); font-size: 0.8rem; margin: 0;" id="header-username">@username</p>
    </div>

    <!-- 1. EDITABLE: Login Credentials -->
    <div class="card">
        <h3><i class="fa-solid fa-lock"></i> Login Credentials</h3>
        <div class="grid">
            <div class="field"><label>Username</label><input type="text" id="username"></div>
            <div class="field">
                <label>Password</label>
                <div class="pass-container">
                    <input type="password" id="password">
                    <i class="fa-solid fa-eye eye-icon" onclick="togglePass()"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. READ-ONLY: Security Vault -->
    <div class="card">
        <h3><i class="fa-solid fa-shield-halved"></i> Security Vault (Read-Only)</h3>
        <div class="grid">
            <div class="field"><label>Unique System ID</label><input type="text" id="sys-id" readonly></div>
            <div class="field"><label>Admin Access Code</label><input type="text" id="sys-code" readonly></div>
            <div class="field" style="grid-column: span 2;"><label>Public Security Key</label><input type="text" id="sys-pub" readonly></div>
            <div class="field" style="grid-column: span 2;"><label>Private Security Key</label><input type="text" id="sys-priv" readonly></div>
        </div>
    </div>

    <!-- 3. READ-ONLY: Identity Verification -->
    <div class="card">
        <h3><i class="fa-solid fa-id-card"></i> ID Verification (Permanent)</h3>
        <div class="field"><label>Ghana Card Number</label><input type="text" id="sys-id-num" readonly></div>
        <div class="id-grid">
            <div><label>Front View</label><img id="id-front" class="id-card-view"></div>
            <div><label>Back View</label><img id="id-back" class="id-card-view"></div>
        </div>
    </div>

    <!-- 4. EDITABLE: Personal Profile -->
    <div class="card">
        <h3><i class="fa-solid fa-user"></i> Personal Details</h3>
        <div class="grid">
            <div class="field"><label>First Name</label><input type="text" id="fname"></div>
            <div class="field"><label>Last Name</label><input type="text" id="lname"></div>
            <div class="field"><label>Email Address</label><input type="email" id="email"></div>
            <div class="field"><label>Phone Number</label><input type="tel" id="phone"></div>
            <div class="field">
                <label>Gender</label>
                <select id="gender"><option value="Male">Male</option><option value="Female">Female</option></select>
            </div>
        </div>
    </div>

    <!-- 5. EDITABLE: Business Branding -->
    <div class="card">
        <h3><i class="fa-solid fa-store"></i> Store Branding</h3>
        <div class="field"><label>Business Name</label><input type="text" id="biz-name"></div>
        <div class="field"><label>Store Biography</label><textarea id="biz-info" rows="3"></textarea></div>
    </div>

    <button class="save-btn" id="save-btn">Update Profile</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-storage.js";

    const firebaseConfig = { apiKey: "AIzaSyDtPxmJUBCweFBswJVflEVuc4jp6-m0BVM", authDomain: "prime-dusk.firebaseapp.com", projectId: "prime-dusk", storageBucket: "prime-dusk.firebasestorage.app" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const userPrefix = localStorage.getItem('eco_user_prefix');
    if(!userPrefix) window.location.href = 'index.html';

    // Password Toggle
    window.togglePass = () => {
        const p = document.getElementById('password');
        p.type = p.type === 'password' ? 'text' : 'password';
    };

    async function loadFullProfile() {
        const snap = await getDoc(doc(db, "users", userPrefix));
        if(snap.exists()) {
            const d = snap.data();
            
            // Header
            document.getElementById('header-fullname').innerText = d.personal.fname + " " + d.personal.lname;
            document.getElementById('header-username').innerText = "@" + d.username;
            if(d.profilePic) document.getElementById('profile-img').src = d.profilePic;

            // Credentials (Editable)
            document.getElementById('username').value = d.username;
            document.getElementById('password').value = d.password;

            // Security Vault (Read Only)
            document.getElementById('sys-id').value = d.userID;
            document.getElementById('sys-code').value = d.adminCode;
            document.getElementById('sys-pub').value = d.publicKey;
            document.getElementById('sys-priv').value = d.privateKey;

            // Verification (Read Only)
            document.getElementById('sys-id-num').value = d.verification.idNumber;
            document.getElementById('id-front').src = d.verification.frontImage;
            document.getElementById('id-back').src = d.verification.backImage;

            // Personal (Editable)
            document.getElementById('fname').value = d.personal.fname;
            document.getElementById('lname').value = d.personal.lname;
            document.getElementById('email').value = d.personal.email;
            document.getElementById('phone').value = d.personal.phone;
            document.getElementById('gender').value = d.personal.gender;

            // Business (Editable)
            document.getElementById('biz-name').value = d.business.name;
            document.getElementById('biz-info').value = d.business.info;
        }
    }
    loadFullProfile();

    document.getElementById('save-btn').onclick = async () => {
        const btn = document.getElementById('save-btn');
        btn.disabled = true; btn.innerText = "Saving Changes...";

        const updateData = {
            "username": document.getElementById('username').value,
            "password": document.getElementById('password').value,
            "personal.fname": document.getElementById('fname').value,
            "personal.lname": document.getElementById('lname').value,
            "personal.email": document.getElementById('email').value,
            "personal.phone": document.getElementById('phone').value,
            "personal.gender": document.getElementById('gender').value,
            "business.name": document.getElementById('biz-name').value,
            "business.info": document.getElementById('biz-info').value
        };

        try {
            await updateDoc(doc(db, "users", userPrefix), updateData);
            alert("Profile Updated Successfully!");
            localStorage.setItem('eco_user_prefix', document.getElementById('username').value);
            location.reload();
        } catch (e) { alert(e.message); btn.disabled = false; }
    };

    // Avatar Upload
    document.getElementById('file-input').onchange = e => {
        const file = e.target.files[0];
        if(!file) return;
        const sRef = ref(storage, `users/${userPrefix}/avatar`);
        const task = uploadBytesResumable(sRef, file);
        task.on('state_changed', 
            (s) => document.getElementById('upload-progress').style.width = (s.bytesTransferred / s.totalBytes) * 100 + '%',
            null,
            async () => {
                const url = await getDownloadURL(task.snapshot.ref);
                await updateDoc(doc(db, "users", userPrefix), { profilePic: url });
                document.getElementById('profile-img').src = url;
                document.getElementById('upload-progress').style.width = "0%";
                alert("Avatar Updated!");
            }
        );
    };
</script>
</body>
</html>
